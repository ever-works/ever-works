name: Build and Publish Docker Images MCP Dev

# Docker Hub (`everco/*`) is NOT published from this workflow. It is published by
# docker-hub-publish.yml, which copies the exact image k8s-build.yml deployed
# (no rebuild, no analytics key baked in) and fails loudly instead of the
# `continue-on-error` push that used to live here and never once succeeded.

on:
  push:
    branches: [develop]
    paths:
      - 'apps/mcp/**'
      - '.deploy/docker/mcp/**'

  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  ever-works-mcp:
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          driver: docker

      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: .deploy/docker/mcp/Dockerfile
          load: true
          platforms: linux/amd64
          tags: |
            ghcr.io/ever-works/ever-works-mcp-dev:latest
            registry.digitalocean.com/ever/ever-works-mcp-dev:latest
          cache-from: type=registry,ref=ghcr.io/ever-works/ever-works-mcp-dev:latest
          cache-to: type=inline
          build-args: |
            NODE_ENV=development
            VERDACCIO_REGISTRY=${{ vars.VERDACCIO_REGISTRY }}

      - name: Docker images list
        run: |
          sudo docker image list

      - name: Install doctl
        if: ${{ vars.DO_ENABLED == 'true' }}
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f  # v2
        continue-on-error: true
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry with short-lived credentials
        if: ${{ vars.DO_ENABLED == 'true' }}
        continue-on-error: true
        run: doctl registry login --expiry-seconds 3600

      - name: Push to DigitalOcean Registry
        if: ${{ vars.DO_ENABLED == 'true' }}
        continue-on-error: true
        run: |
          docker push registry.digitalocean.com/ever/ever-works-mcp-dev:latest

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to Github Registry
        run: |
          docker push ghcr.io/ever-works/ever-works-mcp-dev:latest

      - name: Login to CW Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        continue-on-error: true
        with:
          registry: ${{ secrets.CW_DOCKER_REGISTRY }}
          username: ${{ secrets.CW_DOCKER_USER }}
          password: ${{ secrets.CW_DOCKER_USER_PASSWORD }}

