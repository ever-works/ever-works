name: Deploy to Trigger.dev Prod

on:
  workflow_run:
    workflows: ["CI"]
    branches: [main]
    types:
      - completed

# M-12: minimum default permissions. Individual jobs can elevate where needed.
permissions:
  contents: read

jobs:
  deploy:
    # Legacy Trigger.dev CLOUD deploy. Skipped once we migrate to self-hosted
    # (TRIGGER_SELFHOSTED=true -> release-trigger-selfhosted.yml handles it).
    # Flip the flag back to re-enable this cloud path.
    # Security (works-security, 2026-10-18): a `workflow_run` trigger also fires for runs of a
    # same-named workflow from a FORK pull request (the fork can add any `on:` and name its
    # branch `main`), and this job would then run with this repository's secrets. Only a run
    # that came from a push or a manual dispatch IN THIS REPOSITORY may continue.
    if: ${{ vars.TRIGGER_SELFHOSTED != 'true' && (github.event_name != 'workflow_run' || ((github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') && github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}

    environment: prod

    steps:
      - uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v3
        with:
          version: 10.33.3

      - name: Use Node.js 26.x
        uses: actions/setup-node@v7
        with:
          node-version: "26.x"
          cache: "pnpm"

      # Resolve dependencies through the internal Verdaccio cache when this job runs
      # on the in-network ARC pool, so the install does not re-pull the tree from the
      # public registry. Falls back to npmjs automatically when the VIP does not answer.
      - name: Configure Registry
        uses: ./.github/actions/configure-registry
        with:
          verdaccio-registry: ${{ vars.VERDACCIO_REGISTRY }}
          verdaccio-token: ${{ secrets.VERDACCIO_TOKEN }}
          force-public: ${{ vars.VERDACCIO_FORCE_PUBLIC }}
          expect-vip: ${{ vars.RUNNER_LINUX_X64_4 != '' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build --filter './packages/**'

      - name: Prepare plugins for Trigger.dev
        working-directory: packages/tasks
        run: pnpm prepare:plugins

      - name: ðŸš€ Deploy Trigger.dev
        working-directory: packages/tasks
        env:
          TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
        run: pnpm dlx trigger.dev@4.4.6 deploy --env prod

