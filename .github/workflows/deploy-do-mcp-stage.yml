name: Deploy MCP to DO Stage

on:
  workflow_run:
    workflows: ['Build and Publish Docker Images MCP Stage']
    branches: [stage]
    types:
      - completed

# M-12: minimum default permissions. Individual jobs can elevate where needed.
permissions:
  contents: read

jobs:
  deploy-mcp-stage:
    # DO is retired (registry 403); we don't deploy to DigitalOcean now. Gate the
    # whole job at job level (not just per-step) so it SKIPS without consuming an ARC
    # runner. Kept (no-removal) — set the DO_ENABLED repo/org var to 'true' to re-enable.
    # Security (works-security, 2026-10-18): a `workflow_run` trigger also fires for runs of a
    # same-named workflow from a FORK pull request (the fork can add any `on:` and name its
    # branch `main`), and this job would then run with this repository's secrets. Only a run
    # that came from a push or a manual dispatch IN THIS REPOSITORY may continue.
    if: ${{ vars.DO_ENABLED == 'true' && (github.event_name != 'workflow_run' || ((github.event.workflow_run.event == 'push' || github.event.workflow_run.event == 'workflow_dispatch') && github.event.workflow_run.head_repository.full_name == github.repository)) }}
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}

    environment:
      name: stage
      url: https://mcpstage.ever.works

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install doctl
        if: ${{ vars.DO_ENABLED == 'true' }}
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f  # v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Save DigitalOcean kubeconfig with short-lived credentials
        if: ${{ vars.DO_ENABLED == 'true' }}
        run: doctl kubernetes cluster kubeconfig save --expiry-seconds 600 k8s-gauzy

      - name: Generate TLS Secrets
        if: ${{ vars.DO_ENABLED == 'true' }}
        run: |
          rm -f ${HOME}/ingress.mcp.crt ${HOME}/ingress.mcp.key
          echo ${{ secrets.INGRESS_MCP_CERT }} | base64 --decode > ${HOME}/ingress.mcp.crt
          echo ${{ secrets.INGRESS_MCP_CERT_KEY }} | base64 --decode > ${HOME}/ingress.mcp.key
          kubectl create secret tls mcpstage.ever.works-tls --save-config --dry-run=client --cert=${HOME}/ingress.mcp.crt --key=${HOME}/ingress.mcp.key -o yaml | kubectl --context do-sfo2-k8s-gauzy apply -f -

      - name: Apply k8s manifests changes in DigitalOcean k8s cluster (if any)
        if: ${{ vars.DO_ENABLED == 'true' }}
        run: |
          envsubst < $GITHUB_WORKSPACE/.deploy/k8s/k8s-manifest.mcp.stage.yaml | kubectl --context do-sfo2-k8s-gauzy apply -f -
        env:
          EVER_WORKS_MCP_API_KEY: ${{ secrets.EVER_WORKS_MCP_API_KEY }}

      # we need this step because for now we just use :latest tag
      # note: for production we will use different strategy later
      - name: Restart Pods to pick up :latest tag version
        if: ${{ vars.DO_ENABLED == 'true' }}
        run: |
          kubectl --context do-sfo2-k8s-gauzy rollout restart deployment/ever-works-mcp-stage

