name: Build and Publish Docker Images Dev

# Docker Hub (`everco/*`) is NOT published from this workflow. It is published by
# docker-hub-publish.yml, which copies the exact image k8s-build.yml deployed
# (no rebuild, no analytics key baked in) and fails loudly instead of the
# `continue-on-error` push that used to live here and never once succeeded.

on:
  push:
    branches: [develop]

  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  ever-works-api:
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0
        with:
          driver: docker

      - name: Prepare build metadata
        id: meta
        run: |
          VERSION=$(grep -m1 '"version"' apps/api/package.json | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: .deploy/docker/api/Dockerfile
          load: true
          platforms: linux/amd64
          tags: |
            ghcr.io/ever-works/ever-works-api-dev:latest
            registry.digitalocean.com/ever/ever-works-api-dev:latest
          cache-from: type=registry,ref=ghcr.io/ever-works/ever-works-api-dev:latest
          cache-to: type=inline
          build-args: |
            NODE_ENV=development
            VERDACCIO_REGISTRY=${{ vars.VERDACCIO_REGISTRY }}
            BUILD_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}
            BUILD_RUN=${{ github.run_number }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}

      - name: Docker images list
        run: |
          sudo docker image list

      # DigitalOcean is retired (registry 403): the doctl auth + DO push below
      # are gated on `vars.DO_ENABLED == 'true'`, which is unset, so they do not
      # run. deploy-do-*.yml is the only thing that applies the k8s-manifest.*.yaml
      # files pinning those DO images, and it is gated on the same var. Kept per
      # the no-removal policy,
      # and deliberately NOT continue-on-error, so that re-enabling the var
      # fails loudly: a silent failure once shipped a stale :latest as a
      # "green" build (incident 2026-06-12: an expired DO token meant prod
      # served the prior build). The CW mirror below stays best-effort by design.
      - name: Install doctl
        if: ${{ vars.DO_ENABLED == 'true' }}

        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f  # v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry with short-lived credentials
        if: ${{ vars.DO_ENABLED == 'true' }}
        run: doctl registry login --expiry-seconds 3600

      - name: Push to DigitalOcean Registry
        if: ${{ vars.DO_ENABLED == 'true' }}
        run: |
          docker push registry.digitalocean.com/ever/ever-works-api-dev:latest

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to Github Registry
        run: |
          docker push ghcr.io/ever-works/ever-works-api-dev:latest

      - name: Login to CW Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        continue-on-error: true
        with:
          registry: ${{ secrets.CW_DOCKER_REGISTRY }}
          username: ${{ secrets.CW_DOCKER_USER }}
          password: ${{ secrets.CW_DOCKER_USER_PASSWORD }}

    #  - name: Push to CW Registry
    #    run: |
    #      docker push ${{ secrets.CW_DOCKER_REGISTRY }}/ever-co/ever-works-api:latest

  ever-works-web:
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # This job builds the PUBLIC web image; fail before that if any
      # workflow reintroduces a NEXT_PUBLIC_POSTHOG_* build arg.
      - uses: ./.github/actions/assert-no-analytics-key

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8  # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e  # v4.3.0

      - name: Prepare build metadata
        id: meta
        run: |
          VERSION=$(grep -m1 '"version"' apps/web/package.json | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a  # v7.3.0
        with:
          context: .
          file: .deploy/docker/web/Dockerfile
          load: true
          platforms: linux/amd64
          tags: |
            ghcr.io/ever-works/ever-works-web-dev:latest
            registry.digitalocean.com/ever/ever-works-web-dev:latest
          cache-from: type=registry,ref=ghcr.io/ever-works/ever-works-web-dev:latest
          cache-to: type=inline
          # NO NEXT_PUBLIC_POSTHOG_* build args, on purpose. Next.js inlines
          # NEXT_PUBLIC_* into the client bundle at `next build`, and every tag
          # this job pushes is PUBLIC on GHCR (docker-compose.yml and
          # docker-compose.demo.yml pull ever-works-web:latest), so a baked key
          # would send self-hosters' browser analytics and session recordings to
          # the Ever Works PostHog project. No Ever Works environment loses
          # analytics: dev / stage / prod run k8s-build's :dev / :stage / :prod
          # digests via ArgoCD (ever-co/k8s-gitops), which never carried a
          # browser key, and .deploy/k8s/k8s-manifest.*.yaml is applied only by
          # deploy-do-*.yml, gated off behind vars.DO_ENABLED. Building from
          # source with your own key: see .deploy/docker/web/Dockerfile.
          build-args: |
            NODE_ENV=development
            VERDACCIO_REGISTRY=${{ vars.VERDACCIO_REGISTRY }}
            NEXT_PUBLIC_BUILD_VERSION=${{ steps.meta.outputs.version }}
            NEXT_PUBLIC_BUILD_SHA=${{ github.sha }}
            NEXT_PUBLIC_BUILD_REF=${{ github.ref_name }}
            NEXT_PUBLIC_BUILD_RUN=${{ github.run_number }}
            NEXT_PUBLIC_BUILD_TIME=${{ steps.meta.outputs.build_time }}

      - name: Docker images list
        run: |
          sudo docker image list

      # DigitalOcean is retired (registry 403): the doctl auth + DO push below
      # are gated on `vars.DO_ENABLED == 'true'`, which is unset, so they do not
      # run. deploy-do-*.yml is the only thing that applies the k8s-manifest.*.yaml
      # files pinning those DO images, and it is gated on the same var. Kept per
      # the no-removal policy,
      # and deliberately NOT continue-on-error, so that re-enabling the var
      # fails loudly: a silent failure once shipped a stale :latest as a
      # "green" build (incident 2026-06-12: an expired DO token meant prod
      # served the prior build). The CW mirror below stays best-effort by design.
      - name: Install doctl
        if: ${{ vars.DO_ENABLED == 'true' }}
        uses: digitalocean/action-doctl@3cb3953159719656269e044e0e24ca16dd2a690f  # v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry with short-lived credentials
        if: ${{ vars.DO_ENABLED == 'true' }}
        run: doctl registry login --expiry-seconds 3600

      - name: Push to DigitalOcean Registry
        if: ${{ vars.DO_ENABLED == 'true' }}
        run: |
          docker push registry.digitalocean.com/ever/ever-works-web-dev:latest

      - name: Login to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to Github Registry
        run: |
          docker push ghcr.io/ever-works/ever-works-web-dev:latest

      - name: Login to CW Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        continue-on-error: true
        with:
          registry: ${{ secrets.CW_DOCKER_REGISTRY }}
          username: ${{ secrets.CW_DOCKER_USER }}
          password: ${{ secrets.CW_DOCKER_USER_PASSWORD }}

    #  - name: Push to CW Registry
    #    run: |
    #      docker push ${{ secrets.CW_DOCKER_REGISTRY }}/ever-co/ever-works-web:latest

