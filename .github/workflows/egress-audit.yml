name: Egress audit

# Proves at runtime, with the API image built from this commit, what the anonymous usage
# statistics module may send: nothing at all when it is switched off, and only the documented
# report when it is on. The API runs from the self-hosting compose file on Docker networks with
# no route out; CoreDNS is its only resolver and a capture sees every connection attempt and DNS
# query from before the process starts. Modes (tools/egress-audit/README.md):
#
#   off             EVER_STATS_ENABLED=false in the container environment: no Ever host looked
#                   up, no connection attempt out, every statistics route 404
#   off_env_file    the same switch written ONLY in the API's .env file
#   loaded_off      module loaded, switched off in Settings by the platform admin: no request
#   positive_stats  module on against the mock platform: reports accepted (202), and no call
#                   other than the statistics report
#   control         positive_stats without the mock must FAIL, so a green run is not a blind one
#
# A second job runs the real sender against the same mock platform (202, every published
# fixture's 422 with its path, 409 for a second key, 202 after an identity reset):
# apps/api/src/instance-stats/__tests__/instance-stats.mock.itest.spec.ts.
#
# The harness and the mock platform are the Ever Platform SDK's dev-only tools package,
# `@ever-co/connect-tools`, pinned to one exact version in tools/egress-audit/package.json and
# installed from the lockfile; nothing of either is copied into this repository.
#
# Runs on every push to develop, stage and main, on pull requests that touch the statistics
# module, the API image or the self-hosting compose files, and on demand.
on:
  push:
    branches: [develop, stage, main]
  pull_request:
    branches: [develop, stage, main]
    paths:
      - 'apps/api/src/instance-stats/**'
      - 'apps/api/src/main.ts'
      - 'apps/api/src/load-env.ts'
      - 'apps/api/src/api.module.ts'
      - 'packages/agent/src/ever-instance/**'
      - 'packages/contracts/src/ever-platform/**'
      - 'packages/plugins/ever-stats-sink/**'
      - '.deploy/docker/api/**'
      - 'docker-compose.yml'
      - 'docker-compose.infra.yml'
      - '.env.compose'
      - 'tools/egress-audit/**'
      # The manifests that pin the Ever Connect SDK packages: a version change re-runs the audit.
      - 'apps/api/package.json'
      - 'packages/agent/package.json'
      - 'packages/contracts/package.json'
      - '.github/workflows/egress-audit.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A push to a protected branch is the verdict for that commit: never cancel it.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The `ever-egress-audit` bin of @ever-co/connect-tools (Apache-2.0), installed below.
  AUDIT_BIN: tools/egress-audit/node_modules/.bin/ever-egress-audit
  EVER_WORKS_API_IMAGE: ever-works-api:egress-audit
  AUDIT_CONFIG: tools/egress-audit/egress-audit.config.json
  AUDIT_ARTIFACTS: egress-audit-artifacts

jobs:
  egress-audit:
    name: egress-audit
    # GitHub-hosted on purpose: the capture needs Docker with NET_RAW and NET_ADMIN, and this job
    # must not queue behind the shared self-hosted pool.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Free disk space for the API image build
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v3
        with:
          version: 10.33.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Install the audit tools (pinned @ever-co/connect-tools, from the lockfile)
        run: |
          # Only the audit's own workspace package: the API is audited as the image built below.
          pnpm install --frozen-lockfile --filter @ever-works/egress-audit
          "$AUDIT_BIN" --help > /dev/null

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1
        with:
          driver: docker

      - name: Prepare build metadata
        id: meta
        run: |
          VERSION=$(grep -m1 '"version"' apps/api/package.json | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build the API image from this commit
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          file: .deploy/docker/api/Dockerfile
          load: true
          platforms: linux/amd64
          tags: ${{ env.EVER_WORKS_API_IMAGE }}
          # The published dev image carries an inline cache; layers that did not change are reused.
          cache-from: type=registry,ref=ghcr.io/ever-works/ever-works-api-dev:latest
          build-args: |
            BUILD_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}
            BUILD_RUN=${{ github.run_number }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}

      - name: Write the API .env files of the modes
        run: |
          : > "$RUNNER_TEMP/api-empty.env"
          printf 'EVER_STATS_ENABLED=false\n' > "$RUNNER_TEMP/api-stats-off.env"
          docker image ls "$EVER_WORKS_API_IMAGE"
          df -h /

      - name: 'off: EVER_STATS_ENABLED=false in the container environment'
        if: ${{ !cancelled() }}
        env:
          EVER_WORKS_AUDIT_DOTENV: ${{ runner.temp }}/api-empty.env
        run: $AUDIT_BIN --config "$AUDIT_CONFIG" --mode off --artifacts "$AUDIT_ARTIFACTS" --verbose

      - name: 'off_env_file: EVER_STATS_ENABLED=false only in the API .env file'
        if: ${{ !cancelled() }}
        env:
          EVER_WORKS_AUDIT_DOTENV: ${{ runner.temp }}/api-stats-off.env
        run: $AUDIT_BIN --config "$AUDIT_CONFIG" --mode off_env_file --artifacts "$AUDIT_ARTIFACTS" --verbose

      - name: 'loaded_off: switched off in Settings'
        if: ${{ !cancelled() }}
        env:
          EVER_WORKS_AUDIT_DOTENV: ${{ runner.temp }}/api-empty.env
        run: $AUDIT_BIN --config "$AUDIT_CONFIG" --mode loaded_off --artifacts "$AUDIT_ARTIFACTS" --verbose

      - name: 'positive_stats: on, against the mock platform'
        if: ${{ !cancelled() }}
        env:
          EVER_WORKS_AUDIT_DOTENV: ${{ runner.temp }}/api-empty.env
        run: $AUDIT_BIN --config "$AUDIT_CONFIG" --mode positive_stats --artifacts "$AUDIT_ARTIFACTS" --verbose

      - name: 'control: positive_stats without the mock platform must fail'
        if: ${{ !cancelled() }}
        env:
          EVER_WORKS_AUDIT_DOTENV: ${{ runner.temp }}/api-empty.env
        run: |
          set +e
          "$AUDIT_BIN" --config "$AUDIT_CONFIG" --mode positive_stats --no-mock --artifacts "$AUDIT_ARTIFACTS" --verbose
          code=$?
          set -e
          if [ "$code" -ne 1 ]; then
            echo "::error::without the mock platform the audit must report a violation (exit 1); it exited $code, so a green run could be a blind one"
            exit 1
          fi
          echo "The control failed as it must (exit 1)."

      - name: Summary
        if: ${{ !cancelled() }}
        run: |
          node -e '
            const fs = require("fs"), path = require("path");
            const dir = process.env.AUDIT_ARTIFACTS;
            const rows = ["| Mode | Exit | Violations | DNS queries | Connection attempts | Calls |", "|---|---|---|---|---|---|"];
            for (const mode of fs.existsSync(dir) ? fs.readdirSync(dir).sort() : []) {
              const file = path.join(dir, mode, "report.json");
              if (!fs.existsSync(file)) continue;
              const r = JSON.parse(fs.readFileSync(file, "utf8"));
              const rules = Object.entries(r.summary.rules).map(([k, v]) => `${k}: ${v}`).join(", ") || "none";
              rows.push(`| ${mode} | ${r.exit} | ${rules} | ${r.summary.dns_queries} | ${r.summary.connection_attempts} | ${r.summary.calls ? r.summary.calls.join(", ") || "none" : "-"} |`);
            }
            fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `## Egress audit\n\n${rows.join("\n")}\n\nThe positive_stats-nomock row is the control and must exit 1.\n`);
          '

      - name: Upload the evidence (pcaps, DNS logs, reports)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: egress-audit
          path: ${{ env.AUDIT_ARTIFACTS }}
          retention-days: 14

  stats-mock:
    name: statistics against the mock platform
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v3
        with:
          version: 10.33.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 26.x
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The `ever-mock-platform` bin of the pinned @ever-co/connect-tools (installed above with
      # the workspace), on loopback only, with its default https issuer.
      - name: Start the mock platform
        run: |
          nohup tools/egress-audit/node_modules/.bin/ever-mock-platform --host 127.0.0.1 --port 18080 \
            > "$RUNNER_TEMP/ever-mock-platform.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://127.0.0.1:18080/__mock/healthz && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/ever-mock-platform.log"
          exit 1

      - name: Build the packages the API tests read
        env:
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm exec turbo build --filter="ever-works-api^..." --filter="@ever-works/ever-stats-sink-plugin..."

      - name: The real sender against the mock platform
        working-directory: apps/api
        env:
          EVER_STATS_MOCK_URL: http://127.0.0.1:18080
        run: node --max-old-space-size=8192 node_modules/jest/bin/jest.js --maxWorkers=1 src/instance-stats/__tests__/instance-stats.mock.itest.spec.ts

      - name: The mock platform's call record
        if: always()
        run: |
          curl -s http://127.0.0.1:18080/__mock/requests || true
          tail -50 "$RUNNER_TEMP/ever-mock-platform.log" || true
