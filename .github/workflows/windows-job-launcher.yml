name: Windows Job Launcher

on:
  pull_request:
    branches: [develop, codex/windows-job-launcher-phase1]
    paths:
      - 'apps/node/native/windows-job-launcher/**'
      - 'apps/node/src/core/windows-job-launcher/**'
      - 'apps/node/src/core/model-execution/**'
      - '.github/workflows/windows-job-launcher.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v3
        with:
          version: 10.33.3

      - name: Setup Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: 'pnpm'

      - name: Install JavaScript dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Rust formatting
        working-directory: apps/node/native/windows-job-launcher
        run: cargo fmt --all -- --check

      - name: Lint native helper
        working-directory: apps/node/native/windows-job-launcher
        run: cargo clippy --locked --all-targets --features test-fixtures -- -D warnings

      - name: Run native and adversarial tests
        working-directory: apps/node/native/windows-job-launcher
        run: cargo test --locked --features test-fixtures -- --test-threads=1

      - name: Build unsigned release and provenance metadata
        working-directory: apps/node/native/windows-job-launcher
        shell: pwsh
        run: .\build-release.ps1

      - name: Verify deterministic metadata and unsigned schema
        working-directory: apps/node/native/windows-job-launcher
        shell: pwsh
        run: |
          $files = @(
            'target/release-metadata/ever-works-windows-job-launcher.json',
            'target/release-metadata/ever-works-windows-job-launcher.sbom.cdx.json',
            'target/release-metadata/ever-works-windows-job-launcher.provenance.intoto.json'
          )
          $first = $files | ForEach-Object { (Get-FileHash -Algorithm SHA256 -LiteralPath $_).Hash }
          .\build-release.ps1 | Out-Null
          $second = $files | ForEach-Object { (Get-FileHash -Algorithm SHA256 -LiteralPath $_).Hash }
          if (Compare-Object $first $second) { throw 'release metadata is not deterministic' }
          $valid = Get-Content -Raw -LiteralPath $files[0] |
            Test-Json -SchemaFile 'unsigned-release-metadata.schema.json'
          if (-not $valid) { throw 'unsigned release metadata failed its schema' }

      - name: Build Node workspace dependencies
        run: pnpm --filter "ever-works-node^..." build

      - name: Test and build trusted adapter and model factory
        run: |
          pnpm --filter ever-works-node test -- src/core/windows-job-launcher src/core/model-execution
          pnpm --filter ever-works-node type-check
          pnpm --filter ever-works-node build

      - name: Prepare ephemeral self-signed test helper
        working-directory: apps/node/native/windows-job-launcher
        shell: pwsh
        run: .\prepare-test-signed-manifest.ps1

      - name: Verify test-only signed manifest schema
        working-directory: apps/node/native/windows-job-launcher
        shell: pwsh
        run: |
          $valid = Get-Content -Raw -LiteralPath 'target/signed-test-fixture/ever-works-windows-job-launcher.signed.json' |
            Test-Json -SchemaFile 'signed-artifact-manifest.schema.json'
          if (-not $valid) { throw 'signed test manifest failed its schema' }

      - name: Test signed helper trust and broker-death cleanup
        run: pnpm --filter ever-works-node test -- src/core/windows-job-launcher/windows-job-helper-trust.windows.spec.ts

      - name: Remove ephemeral test certificate and helper
        if: always()
        working-directory: apps/node/native/windows-job-launcher
        shell: pwsh
        run: .\prepare-test-signed-manifest.ps1 -Cleanup
