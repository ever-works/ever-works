name: CI

on:
  push:
    branches: [main, develop, stage]
  pull_request:
    branches: [main, develop, stage]
  workflow_dispatch:

# M-12: explicit minimum default permissions for every job. Individual jobs
# can elevate to `write` only on the scope they need. Without this, any
# compromised third-party action runs with whatever the repo default grants
# (typically `contents: write`).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Raise the Node heap for every step in every job. The `@ever-works/plugin`
# tsup build emits `.d.ts` for ~18 entry points, which exhausts the default
# ~2 GB heap and fails the plugin-matrix + secret-store-matrix + lint-and-test
# jobs with ERR_WORKER_OUT_OF_MEMORY (the ESM/CJS outputs build fine; only the
# DTS worker OOMs). 6 GB clears it with headroom on the standard runner.
env:
  NODE_OPTIONS: --max-old-space-size=6144

jobs:
  # Relocated out of `lint-and-test` (body unchanged). It used to run BEFORE
  # `Check formatting` / `Build all packages` / `run test on all packages`, so a
  # dependency advisory failed the job and reported those three as `skipped`
  # rather than run. A red `lint-and-test` then meant "nothing was built or
  # tested" — indistinguishable at a glance from a real test failure, which is
  # how a broken spec sat unnoticed on develop for two months.
  #
  # As its own job the gate is exactly as strict (still a hard fail on
  # HIGH/CRITICAL) but it can no longer mask the build/test signal, and the two
  # surface as separate checks so the cause is obvious from the checks list.
  #
  # No `pnpm install` here on purpose: `pnpm audit` resolves from
  # `pnpm-lock.yaml` alone, so this job is checkout + pnpm + audit.
  dependency-audit:
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v3
        with:
          version: 10.33.3

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x

      # H-15: fail the build if any production transitive dep has a HIGH or
      # CRITICAL vulnerability. The existing `pnpm.overrides` block proves
      # maintainers already patch high/critical drift; this just makes it
      # CI-enforced so a new transitive doesn't slip through unnoticed.
      # Moderate findings stay as Dependabot work (re-evaluate the threshold
      # if the backlog becomes too noisy).
      # NOTE (2026-07): npm retired the legacy audit endpoints
      # (`/-/npm/v1/security/audits` + `/quick`) — they now return HTTP 410,
      # so `pnpm audit` fails with `ERR_PNPM_AUDIT_BAD_RESPONSE` regardless of
      # whether any vulnerability exists. That is an endpoint outage, not a
      # security finding, and it was red-lining every PR in the repo. Degrade
      # gracefully: a genuine HIGH/CRITICAL finding still fails CI, but an
      # endpoint-unavailable error only warns. Self-healing — the gate re-arms
      # automatically once pnpm/npm expose a working (bulk) advisory endpoint.
      - name: Audit production dependencies (high+)
        shell: bash
        run: |
          set +e
          # Retry the whole audit, not just the request. pnpm already retries
          # the HTTP call three times internally (immediate, +10s, +1min) and
          # STILL returns ERR_SOCKET_TIMEOUT when npm's audit endpoint is
          # having a bad few minutes: observed four times in a row on one PR
          # while `develop` passed in the same window. That is an outage, not
          # a finding, and it was hard-failing unrelated PRs.
          #
          # This does NOT weaken the gate: a genuine HIGH/CRITICAL result is
          # deterministic, so it reproduces on every attempt and still fails
          # below. Only a transient transport error benefits from a retry.
          attempt=1
          max_attempts=3
          while :; do
            output="$(pnpm audit --prod --audit-level=high 2>&1)"
            code=$?
            if [ "$code" -eq 0 ]; then
              printf '%s\n' "$output"
              exit 0
            fi
            # Retry ONLY on a transport-level failure. A real advisory, and the
            # retired-endpoint response handled below, are both reproducible,
            # so retrying either just spends minutes reaching the same answer.
            if [ "$attempt" -ge "$max_attempts" ] || ! printf '%s' "$output" | grep -qE 'ERR_SOCKET_TIMEOUT|ECONNRESET|ETIMEDOUT|EAI_AGAIN'; then
              break
            fi
            echo "::notice title=Retrying dependency audit::Transport error on attempt ${attempt}/${max_attempts}; retrying in $((attempt * 15))s."
            sleep "$((attempt * 15))"
            attempt=$((attempt + 1))
          done
          printf '%s\n' "$output"
          # Detect the endpoint outage by pnpm's OWN error CODE only — not by
          # human-language phrases like "410"/"retired", which could legitimately
          # appear inside a real CVE advisory description and wrongly soft-pass a
          # run that has actual vulnerabilities. `ERR_PNPM_AUDIT_BAD_RESPONSE` is
          # emitted only when the audit endpoint returns an unusable response; a
          # genuine high/critical finding never prints this token, so it still
          # hard-fails below. A transport error has already been retried above
          # and still hard-fails here if it never succeeded: retrying changes
          # how often we ask, never what counts as a finding.
          if printf '%s' "$output" | grep -qF 'ERR_PNPM_AUDIT_BAD_RESPONSE'; then
            echo "::warning title=Dependency audit skipped::npm's audit endpoint is unavailable (ERR_PNPM_AUDIT_BAD_RESPONSE — legacy audit API retired, HTTP 410). The high/critical audit gate is soft for this run and re-arms automatically once a working endpoint is restored."
            exit 0
          fi
          echo "::error title=Dependency audit failed::pnpm audit reported HIGH/CRITICAL production vulnerabilities (or an unexpected error). See the output above."
          exit "$code"

  # T9 — an ORACLE, not a gate. `skills-ref` is the reference library for
  # Agent Skills; running it over our fixture corpus answers a question our own
  # tests cannot: does our reading of the specification match somebody else's?
  #
  # `continue-on-error` is the whole point. The two tools do not answer the same
  # question — ours validates a PACKAGE and reports per-skill findings without
  # rejecting the package, theirs validates one skill — so a difference is
  # information, not a defect. And `skills-ref` is at 0.1.1; pinning merges to a
  # young external tool's opinion would hand it a veto.
  skills-oracle:
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install the reference library
        run: pip install --quiet skills-ref==0.1.1

      - name: Cross-check the fixture corpus
        run: python packages/agent-plugins/scripts/oracle-check.py packages/agent-plugins/fixtures


  lint-and-test:
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v3
        with:
          version: 10.33.3

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      # Resolve dependencies through the internal Verdaccio cache when this job runs
      # on the in-network ARC pool, so the install does not re-pull the tree from the
      # public registry. Falls back to npmjs automatically when the VIP does not answer.
      - name: Configure Registry
        uses: ./.github/actions/configure-registry
        with:
          verdaccio-registry: ${{ vars.VERDACCIO_REGISTRY }}
          verdaccio-token: ${{ secrets.VERDACCIO_TOKEN }}
          force-public: ${{ vars.VERDACCIO_FORCE_PUBLIC }}
          expect-vip: ${{ vars.RUNNER_LINUX_X64_4 != '' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Formatting is checked on EVERY run, including docs-only PRs: prettier
      # covers *.md, and a hand-wrapped markdown table is exactly the kind of
      # thing it catches (PR #1949). It needs only the install above.
      - name: Check formatting
        run: pnpm format:check

      # This job has been called `lint-and-test` since it was written and did
      # not lint. Nothing in any workflow ran ESLint, which is how 42 errors
      # accumulated on `develop` unnoticed — and it would have made the new
      # rule banning unscoped BFF calls decorative, since a guardrail nobody
      # enforces is a comment.
      #
      # Like `format:check` above, this runs on EVERY run: it needs only the
      # install, and a lint error should not wait for a 10-minute build to be
      # reported. The four rules with an existing backlog are demoted to
      # warnings in `apps/web/eslint.config.mjs` (see EW-790) so the gate can
      # be switched on today rather than behind a large refactor; everything
      # else is enforced from now on.
      - name: Lint
        run: pnpm lint

      # Decide whether the expensive half of this job is needed.
      #
      # `lint-and-test` is the ONLY required status check on main/develop/stage,
      # so this job must always RUN and report a conclusion — a workflow-level
      # `paths-ignore` would leave the check permanently "expected" and block
      # every docs PR forever. Hence a per-step gate rather than a trigger
      # filter.
      #
      # Fails SAFE: every unexpected condition (push build, absent base sha,
      # unfetchable base, empty or failed diff) resolves to `code=true`, so the
      # full build+test runs. The only way to skip it is a positive
      # determination that the PR touches nothing but `docs/` and `*.md`.
      #
      # Note the pattern deliberately anchors `^docs/` rather than matching
      # `docs/` anywhere: `apps/docs` is a real Next.js app whose .tsx must
      # still be built and tested.
      - name: Decide whether the heavy build/test steps are needed
        id: scope
        run: |
          decide() { echo "code=$1" >> "$GITHUB_OUTPUT"; exit 0; }
          [ "${{ github.event_name }}" = "pull_request" ] || decide true
          BASE="${{ github.event.pull_request.base.sha }}"
          [ -n "$BASE" ] || decide true
          git fetch --no-tags --depth=1 origin "$BASE" >/dev/null 2>&1 || true
          git cat-file -e "$BASE^{commit}" 2>/dev/null || decide true
          CHANGED=$(git diff --name-only "$BASE" HEAD 2>/dev/null) || decide true
          [ -n "$CHANGED" ] || decide true
          echo "Changed files:"; printf '  %s\n' $CHANGED
          if printf '%s\n' "$CHANGED" | grep -qvE '^docs/|\.md$'; then
            echo "-> non-docs changes present; running the full build + test."
            decide true
          else
            echo "-> docs-only change; skipping build + test (formatting was still checked)."
            decide false
          fi

      - name: Build all packages
        if: steps.scope.outputs.code == 'true'
        run: pnpm build --filter=!./apps/docs

      # --- Regression guard: the /login locale-rewrite defect class -----------
      #
      # On 2026-08-24 `app.ever.works/login` was down ~8.5 h. FIVE fixes were
      # attempted; FOUR shipped with a fully green CI. Nothing here could catch
      # it, because every test stops short of the boundary where it fails: the
      # unit specs mock `next-intl/middleware` and assert the header string
      # `proxy()` RETURNS, but the failure happens AFTER `proxy()` returns,
      # inside Next's middleware adapter when it reparses `x-middleware-rewrite`:
      #   * an ABSOLUTE origin not matching the server's init URL is treated as
      #     an EXTERNAL rewrite -> 307 -> re-enters middleware -> infinite loop;
      #   * a PATH-ONLY value is reparsed as `new NextURL(v)` with NO base and
      #     throws ERR_INVALID_URL -> HTTP 500.
      #
      # This boots the artifact the previous step already built and makes ONE
      # request that CROSSES that boundary. Three ingredients, each necessary,
      # each missing from at least one existing test:
      #
      #  1. Host / X-Forwarded-Host must DIFFER from the listen address. That
      #     difference IS the defect. `e2e.yml` uses 127.0.0.1 with no forwarded
      #     headers, so its reconstructed authority equals the internal one and
      #     the bug cannot manifest there at all.
      #  2. X-Forwarded-Proto: https MUST be sent. Next derives its comparison
      #     URL's SCHEME from it, and the #2243 attempt hardcoded 'http:' - host
      #     and port matched, only the scheme diverged. Without this header a
      #     broken build answers 200 and this guard would pass. Recorded nowhere
      #     else in the repo; do not drop it.
      #  3. ALLOWED_REDIRECT_URLS must contain the authority spoofed below. It
      #     defaults to 'localhost,127.0.0.1' (apps/web/src/lib/constants.ts),
      #     and dev/stage allowlist only ONE of their two public hostnames -
      #     which is why "green on stage" was never evidence about prod.
      #     Inheriting a stage-shaped allowlist here would rebuild that blind
      #     spot inside CI.
      #
      # ASSERT THE OUTCOME - status + absence of Location + a body marker. NEVER
      # assert the `x-middleware-rewrite` value: pinning that header is exactly
      # what left the two unit specs unable to fail (the value is identical in
      # the fixed state and in broken state 14bd578a2).
      #
      # The step proves itself on every run:
      #   * KNOWN-PRESENT CONTROL - the same request WITHOUT forwarded headers
      #     must also be 200, so a green can never come from a probe that was
      #     incapable of succeeding.
      #   * BITE PROOF - a SECOND server on its own port with
      #     LEGACY_LOCALE_REWRITE_OVERRIDE_ENABLED=true re-enables the collapse and
      #     MUST NOT return 200. Measured locally 2026-08-24: it returns 500 with
      #     ERR_INVALID_URL. No rebuild is needed because `proxy.ts` reads that
      #     flag per request, so this costs seconds. Without a bite proof the step
      #     could be structurally incapable of going red - the exact failure mode
      #     of the two unit specs it replaces.
      #     A DEAD bite server also fails the guard, which would satisfy the proof
      #     vacuously, so a 000 (no answer) is treated as an ERROR, not a pass.
      - name: 'Guard: /login renders behind a foreign authority'
        if: steps.scope.outputs.code == 'true'
        working-directory: apps/web
        env:
          NODE_ENV: production
          ALLOWED_REDIRECT_URLS: https://app.ever.works
          # A secret under 32 chars makes every auth route 500, which would turn
          # this guard red for the wrong reason. Probe-only; unused elsewhere.
          AUTH_SECRET: ci-guard-probe-secret-at-least-32-chars
          COOKIE_SECRET: ci-guard-probe-secret-at-least-32-chars
        run: |
          set -uo pipefail

          # Two servers on two ports, started once and never restarted mid-step. Killing a
          # `pnpm start` wrapper orphans its `next start` child, which keeps holding the
          # port and then silently answers the next probe from the WRONG configuration —
          # that is a real failure this harness hit while being written, and it made the
          # bite proof report a false pass. Separate ports remove the possibility.
          HEALTHY_PORT=34119
          BITE_PORT=34120

          start_server() { # $1=label $2=port $3=optional extra env assignment
            local label="$1" port="$2" extra="${3:-}"
            local log="/tmp/guard-$label.log"
            rm -f "$log"
            if [ -n "$extra" ]; then
              ( export "$extra"; pnpm exec next start -p "$port" ) >"$log" 2>&1 &
            else
              ( pnpm exec next start -p "$port" ) >"$log" 2>&1 &
            fi
            for _ in $(seq 1 90); do
              # Readiness must name OUR port: on a shared runner a stale listener would
              # otherwise serve these probes and the result would describe someone else's
              # process.
              if grep -qiE 'ready in' "$log" && grep -q "$port" "$log"; then
                echo "  [$label] ready on $port"
                return 0
              fi
              sleep 1
            done
            echo "::error::[$label] web server never became ready on port $port"
            sed -n '1,40p' "$log"
            return 1
          }

          probe() { # $1=port $2=fwd|bare -> "status|location|marker"
            local port="$1" mode="$2" code loc mark
            if [ "$mode" = fwd ]; then
              if ! code=$(curl -sS -o /tmp/g.html -D /tmp/g.hdr --max-redirs 0 -m 30 -w '%{http_code}' \
                -H 'Host: app.ever.works' -H 'X-Forwarded-Host: app.ever.works' \
                -H 'X-Forwarded-Proto: https' "http://127.0.0.1:$port/login" 2>/dev/null); then
                code=000
              fi
            else
              if ! code=$(curl -sS -o /tmp/g.html -D /tmp/g.hdr --max-redirs 0 -m 30 -w '%{http_code}' \
                "http://127.0.0.1:$port/login" 2>/dev/null); then
                code=000
              fi
            fi
            loc=no; grep -qi '^location:' /tmp/g.hdr 2>/dev/null && loc=yes
            mark=no; grep -q 'Sign In' /tmp/g.html 2>/dev/null && mark=yes
            echo "${code}|${loc}|${mark}"
          }

          PASS="200|no|yes"
          rc=0

          start_server healthy "$HEALTHY_PORT" "" || exit 1
          start_server bite    "$BITE_PORT" "LEGACY_LOCALE_REWRITE_OVERRIDE_ENABLED=true" || exit 1

          GUARD=$(probe "$HEALTHY_PORT" fwd)
          echo "guard   (foreign authority + https) -> $GUARD   [want $PASS]"
          if [ "$GUARD" != "$PASS" ]; then
            echo "::error::/login FAILED behind a foreign authority ($GUARD). This is the defect"
            echo "::error::class behind the 2026-08-24 outage: a 3xx WITH a location header is the"
            echo "::error::redirect loop; a 500 is the ERR_INVALID_URL path-only variant. Start with"
            echo "::error::apps/web/src/proxy.ts and next.config.ts (skipProxyUrlNormalize)."
            sed -n '1,60p' /tmp/guard-healthy.log
            rc=1
          fi

          CONTROL=$(probe "$HEALTHY_PORT" bare)
          echo "control (no forwarded headers)      -> $CONTROL   [want $PASS]"
          if [ "$CONTROL" != "$PASS" ]; then
            echo "::error::KNOWN-PRESENT CONTROL failed ($CONTROL) - the harness itself is broken"
            echo "::error::(build, env or port), so the guard line above proves nothing in either"
            echo "::error::direction. Fix this before trusting any green here."
            rc=1
          fi

          BITE=$(probe "$BITE_PORT" fwd)
          BITE_CODE="${BITE%%|*}"
          echo "bite    (legacy override enabled)   -> $BITE   [want a real HTTP status that is NOT $PASS]"
          if [ "$BITE_CODE" = "000" ]; then
            # A dead bite server also "is not 200", so without this branch a failed server
            # would silently satisfy the bite proof. That is the exact vacuity this step
            # exists to prevent, so it must be an error, not a pass.
            echo "::error::BITE PROOF INCONCLUSIVE: the bite server did not answer at all (000)."
            echo "::error::A dead server trivially 'fails' the guard, which proves nothing. The"
            echo "::error::bite proof only counts when a LIVE server answers with a non-200."
            sed -n '1,40p' /tmp/guard-bite.log
            rc=1
          elif [ "$BITE_CODE" = "200" ]; then
            echo "::error::BITE PROOF FAILED: with LEGACY_LOCALE_REWRITE_OVERRIDE_ENABLED=true the"
            echo "::error::bite server still answered HTTP 200, so the guard cannot detect the defect"
            echo "::error::regardless of its Location/body markers, and its green above is"
            echo "::error::worthless. Either the override no longer re-enables the rewrite collapse"
            echo "::error::(apps/web/src/proxy.ts) or the probe never reached the middleware."
            rc=1
          else
            echo "  bite proof OK: the guard demonstrably goes red when the defect is re-enabled."
          fi

          # Best-effort cleanup; the runner is ephemeral, so a survivor harms nothing.
          pkill -f "next start -p $HEALTHY_PORT" 2>/dev/null || true
          pkill -f "next start -p $BITE_PORT" 2>/dev/null || true

          exit $rc

      - name: run test on all packages
        if: steps.scope.outputs.code == 'true'
        run: pnpm test

      - name: Build Internal CLI
        if: steps.scope.outputs.code == 'true'
        working-directory: apps/internal-cli
        run: pnpm build:cli
        env:
          API_URL: ${{ secrets.API_URL }}
          WEB_URL: ${{ secrets.WEB_URL }}

      - name: Build External CLI
        if: steps.scope.outputs.code == 'true'
        working-directory: apps/cli
        run: pnpm build:cli
        env:
          API_URL: ${{ secrets.API_URL }}
          WEB_URL: ${{ secrets.WEB_URL }}

      - name: Test Internal CLI
        if: steps.scope.outputs.code == 'true'
        working-directory: apps/internal-cli
        # NODE_ENV=test signals this is a test-context bootstrap (the CLI uses
        # in-memory sqlite here, not a real database). C-07 PR-B made
        # `autoMigrate()` default-off everywhere except NODE_ENV=test â€” without
        # this env, `synchronize` doesn't run and the eager NestJS bootstrap
        # hits "no such table: subscription_plans". Equivalent to setting
        # DATABASE_AUTOMIGRATE=true explicitly; NODE_ENV=test is the standard
        # test-context signal already used by the unit-test suite.
        env:
          NODE_ENV: test
        run: pnpm test:cli

      - name: Test External CLI
        if: steps.scope.outputs.code == 'true'
        working-directory: apps/cli
        # See note above on the Internal CLI step â€” same C-07 PR-B implication.
        env:
          NODE_ENV: test
        run: pnpm test:cli

  # EW-742 P6 T37 â€” per-provider job-runtime plugin matrix.
  #
  # Why a separate job: the aggregate `pnpm test` step in `lint-and-test`
  # passes/fails as a single signal. When a contract change in
  # `@ever-works/plugin` ripples through the 4 plugin packages, the
  # aggregate run hides WHICH plugin broke. This job fans each plugin's
  # test suite into its own cell so the failure signal is per-provider.
  #
  # Scope: contract + bindToTenant + dispatcher/worker-host factories +
  # T31 enqueue-options translators + T36-T40 tenant conformance suite
  # â€” all mocks-only. The real-infra portion of T37 (a `TENANT_OVERLAY=
  # {off|on}` Ã— `JOB_RUNTIME={trigger|temporal|bullmq|pgboss|inngest}`
  # matrix against live Redis/Postgres/Temporal/Inngest service
  # containers) remains gated on CI infra availability â€” tracked in
  # tasks.md and ADR-017.
  #
  # Independent of `lint-and-test`: this job re-installs and re-builds
  # only the slice it needs, so a failing aggregate doesn't block this
  # signal (and vice versa).
  job-runtime-plugin-matrix:
    # Pool-relief (2026-07-18): these already passed on the PR; skip on main/stage
    # promotion pushes so k8s-build (the deploy build) is not starved on the shared
    # ARC pool. Still runs on PRs + develop pushes. Reversible: remove this if line.
    if: ${{ !(github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stage')) }}
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}

    strategy:
      fail-fast: false
      matrix:
        provider:
          - bullmq
          - pgboss
          - temporal
          - inngest
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v3
        with:
          version: 10.33.3

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      # Resolve dependencies through the internal Verdaccio cache when this job runs
      # on the in-network ARC pool, so the install does not re-pull the tree from the
      # public registry. Falls back to npmjs automatically when the VIP does not answer.
      - name: Configure Registry
        uses: ./.github/actions/configure-registry
        with:
          verdaccio-registry: ${{ vars.VERDACCIO_REGISTRY }}
          verdaccio-token: ${{ secrets.VERDACCIO_TOKEN }}
          force-public: ${{ vars.VERDACCIO_FORCE_PUBLIC }}
          expect-vip: ${{ vars.RUNNER_LINUX_X64_4 != '' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # @ever-works/plugin ships the contract surface + the
      # contracts-conformance subpath that each provider plugin imports
      # via `runJobRuntimeContractSuite` / `runJobRuntimeTenantContractSuite`
      # / `runSecretStoreContractSuite`. Build it first so the
      # downstream plugin's vitest can resolve the subpath.
      - name: Build @ever-works/plugin (contract + conformance subpath)
        run: pnpm --filter "@ever-works/plugin..." build

      - name: Test @ever-works/job-runtime-${{ matrix.provider }}-plugin
        run: pnpm --filter @ever-works/job-runtime-${{ matrix.provider }}-plugin test

  # EW-742 P6 T32/T37 real-infra axis â€” all 4 push-model providers
  # against live infra: BullMQ on Redis, pg-boss on Postgres, Temporal
  # via temporalio/auto-setup (shares the Postgres service, Temporal
  # namespaces its own tables), Inngest via the inngest/inngest dev
  # server. Real-infra cells run as a SEPARATE job from the mocks-only
  # matrix so an infra hiccup doesn't mask the mocks-only failure signal.
  # Cost gate: this job is restricted to direct pushes to main (see the
  # job-level `if:` below) because the four service containers burn
  # Ubicloud minutes; per-PR signal stays covered by the mocks-only
  # job-runtime-plugin-matrix above.
  job-runtime-real-infra:
    # Cost gate: real-infra cells spin up 4 service containers (Redis,
    # Postgres, Temporal auto-setup, Inngest dev-server) which burn
    # Ubicloud minutes. Run on direct pushes to main only â€” PR signal
    # stays covered by the mocks-only job-runtime-plugin-matrix above.
    # Re-enable per-PR by removing this `if:` line.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
      temporal:
        # Pinned (was `:latest`). A moving `:latest` is why this job flipped red:
        # the tag advanced and the frontend now binds to the container's eth0 IP
        # instead of the loopback the healthcheck probes. 1.29.3 == what `:latest`
        # resolved to when this was fixed; bump deliberately, not by drift.
        image: temporalio/auto-setup:1.29.3
        env:
          DB: postgres12
          DB_PORT: '5432'
          POSTGRES_USER: test
          POSTGRES_PWD: test
          POSTGRES_SEEDS: postgres
          # THE fix: bind the frontend on all interfaces so the loopback
          # healthcheck below can reach it. Without this, temporal binds only the
          # container IP (e.g. 172.18.0.x:7233) and `nc -z localhost 7233` fails
          # for the whole window -> the container is marked unhealthy and
          # "Initialize containers" fails even though the server is up. Verified
          # on a k8s repro: with BIND_ON_IP=0.0.0.0 the loopback probe passes ~80s
          # in; without it, never.
          BIND_ON_IP: '0.0.0.0'
        ports: ['7233:7233']
        # Schema setup + boot measured ~80s on a ready DB; give it comfortable
        # headroom (start-period 45s + 18x10s = 225s) so a slow warm-up or a
        # postgres-not-yet-queryable retry can't tip it over.
        options: --health-cmd "nc -z localhost 7233" --health-interval 10s --health-timeout 5s --health-retries 18 --health-start-period 45s
      # NOTE: inngest is intentionally NOT a service container. The
      # `inngest/inngest` image's default entrypoint is the CLI (it just prints
      # help and exits) — the dev server only starts under the `dev` subcommand,
      # and GitHub `services:` cannot override a container's command. So the
      # container never listened on 8288 and the job failed at "Initialize
      # containers". Started as a `docker run` step below instead (which CAN pass
      # `dev`), reachable at localhost:8288 the same way the service containers are.

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v3
        with:
          version: 10.33.3

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'pnpm'

      # Resolve dependencies through the internal Verdaccio cache when this job runs
      # on the in-network ARC pool, so the install does not re-pull the tree from the
      # public registry. Falls back to npmjs automatically when the VIP does not answer.
      - name: Configure Registry
        uses: ./.github/actions/configure-registry
        with:
          verdaccio-registry: ${{ vars.VERDACCIO_REGISTRY }}
          verdaccio-token: ${{ secrets.VERDACCIO_TOKEN }}
          force-public: ${{ vars.VERDACCIO_FORCE_PUBLIC }}
          expect-vip: ${{ vars.RUNNER_LINUX_X64_4 != '' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @ever-works/plugin (contract + conformance subpath)
        run: pnpm --filter "@ever-works/plugin..." build

      - name: BullMQ real-infra
        env:
          EW_TEST_REAL_REDIS_URL: redis://localhost:6379
        run: pnpm --filter @ever-works/job-runtime-bullmq-plugin test

      - name: pg-boss real-infra
        env:
          EW_TEST_REAL_PGBOSS_URL: postgres://test:test@localhost:5432/test
        run: pnpm --filter @ever-works/job-runtime-pgboss-plugin test

      # The temporal-plugin real-infra suite tags workflows with a custom
      # `tenantId` search attribute (multi-tenant routing). Temporal v10 rejects
      # `StartWorkflow` with an unregistered search attribute
      # ("Namespace default has no mapping defined for search attribute tenantId"),
      # and auto-setup does not create custom attributes. Register it up front,
      # inside the temporal service container (localhost:7233 = its own frontend)
      # via the `temporal` CLI the image already ships. Idempotent enough for CI —
      # `|| true` so a re-run where it already exists doesn't fail the job.
      - name: Register Temporal search attributes
        run: |
          cid="$(docker ps -qf 'ancestor=temporalio/auto-setup:1.29.3' | head -n1)"
          if [ -z "$cid" ]; then echo "::error::temporal container not found"; exit 1; fi
          # The temporal-plugin maps three custom search attributes
          # (temporal-enqueue-options.ts): tenantId + concurrencyKey are single
          # Keywords; tags is a list -> KeywordList. auto-setup keeps migrating the
          # visibility schema AFTER the frontend port opens (the healthcheck only
          # proves the port listens), so creating a custom attribute too early
          # silently no-ops and the test later fails with "no mapping defined for
          # search attribute tags" (flaky: whoever wins the race). Register, then
          # poll `list` until all three are actually present. Deterministic.
          want="tenantId concurrencyKey tags"
          registered=0
          for attempt in $(seq 1 40); do
            docker exec "$cid" temporal operator search-attribute create \
              --namespace default --name tenantId --type Keyword >/dev/null 2>&1 || true
            docker exec "$cid" temporal operator search-attribute create \
              --namespace default --name concurrencyKey --type Keyword >/dev/null 2>&1 || true
            docker exec "$cid" temporal operator search-attribute create \
              --namespace default --name tags --type KeywordList >/dev/null 2>&1 || true
            listing="$(docker exec "$cid" temporal operator search-attribute list --namespace default 2>/dev/null || true)"
            missing=""
            for a in $want; do echo "$listing" | grep -qw "$a" || missing="$missing $a"; done
            if [ -z "$missing" ]; then registered=1; echo "All custom search attributes present after attempt $attempt:$want"; break; fi
            echo "attempt $attempt/40: still missing:$missing - retrying in 3s"
            sleep 3
          done
          echo "Registered search attributes:"
          docker exec "$cid" temporal operator search-attribute list --namespace default || true
          if [ "$registered" != "1" ]; then echo "::error::custom search attributes never registered after 40 attempts"; exit 1; fi

      - name: Temporal real-infra
        env:
          EW_TEST_REAL_TEMPORAL_ADDRESS: localhost:7233
        run: pnpm --filter @ever-works/job-runtime-temporal-plugin test

      # Start the Inngest dev server via `docker run` (not a service container —
      # see the note in `services:` above). `dev` is the subcommand that actually
      # serves; `--host 0.0.0.0` binds all interfaces so the loopback probe and
      # the test's http://localhost:8288 both reach it; `--no-discovery` skips the
      # auto-scan for a local app (there is none here). Same pinned image tag.
      - name: Start Inngest dev server
        run: |
          docker run -d --name inngest -p 8288:8288 \
            inngest/inngest:v1.38.1 inngest dev --no-discovery --host 0.0.0.0
          echo "Waiting for Inngest on http://localhost:8288 ..."
          for i in $(seq 1 45); do
            if curl -sf -o /dev/null http://localhost:8288/; then
              echo "Inngest is ready."; exit 0
            fi
            sleep 2
          done
          echo "::error::Inngest dev server did not become ready in time"
          docker logs inngest || true
          exit 1

      - name: Inngest real-infra
        env:
          EW_TEST_REAL_INNGEST_URL: http://localhost:8288
        run: pnpm --filter @ever-works/job-runtime-inngest-plugin test

  # Companion matrix for the secret-store-resolver provider family
  # (EW-742 P3.2 / P6 â€” runSecretStoreContractSuite is wired into all 7
  # plugins via `<plugin>-conformance.spec.ts`). Same rationale as the
  # job-runtime matrix above: per-provider failure signal.
  secret-store-plugin-matrix:
    # Pool-relief (2026-07-18): these already passed on the PR; skip on main/stage
    # promotion pushes so k8s-build (the deploy build) is not starved on the shared
    # ARC pool. Still runs on PRs + develop pushes. Reversible: remove this if line.
    if: ${{ !(github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stage')) }}
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}

    strategy:
      fail-fast: false
      matrix:
        provider:
          - vault
          - k8s
          - infisical
          - doppler
          - aws-sm
          - gcp-sm
          - azure-kv
        node-version: [22.x]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v3
        with:
          version: 10.33.3

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      # Resolve dependencies through the internal Verdaccio cache when this job runs
      # on the in-network ARC pool, so the install does not re-pull the tree from the
      # public registry. Falls back to npmjs automatically when the VIP does not answer.
      - name: Configure Registry
        uses: ./.github/actions/configure-registry
        with:
          verdaccio-registry: ${{ vars.VERDACCIO_REGISTRY }}
          verdaccio-token: ${{ secrets.VERDACCIO_TOKEN }}
          force-public: ${{ vars.VERDACCIO_FORCE_PUBLIC }}
          expect-vip: ${{ vars.RUNNER_LINUX_X64_4 != '' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build @ever-works/plugin (contract + conformance subpath)
        run: pnpm --filter "@ever-works/plugin..." build

      - name: Test @ever-works/secret-store-${{ matrix.provider }}-plugin
        run: pnpm --filter @ever-works/secret-store-${{ matrix.provider }}-plugin test
