name: k8s-build
on:
  workflow_dispatch:
  push:
    branches: [develop, stage, main, master]
concurrency:
  group: k8s-build-${{ github.ref }}
  # 🛑 Every ref that can trigger this workflow is deploy-bearing and QUEUES.
  #
  # This workflow is the ONLY one that publishes the tags the clusters pull
  # (`:dev`/`:stage`/`:prod` + `:sha-<sha>`); `docker-build-publish-*.yml`
  # pushes `:latest`, which no Deployment tracks. So a cancelled run here is
  # not lost CI signal — it is a fix that never reaches an environment.
  #
  # Measured 2026-08-24: a successful k8s-build on `main` takes 215-243 min,
  # while the cascade cadence that morning was 21-54 min. With
  # `cancel-in-progress: true`, FOUR consecutive production image builds were
  # killed by the next cascade and prod sat on a 7-hour-old image carrying a
  # defect that made the credit ledger unable to write at all. The build can
  # never win that race: it is not a slow build, it is an unwinnable one.
  #
  # Queueing costs a little runner time and bounds the wait at one build.
  # Cancelling makes the wait unbounded. Same shape as #2210 for the stage
  # E2E gate.
  cancel-in-progress: false
permissions:
  contents: read
  packages: write
jobs:
  build:
    # 🛑 Deliberately the x64-16 pool, not x64-4. `ever-works-linux-x64-4` is ORG-scoped with
    # maxRunners=4 and is referenced by 29 of the 30 workflows in this org, so it serves every
    # repo's CI as well as every deploy. Measured 2026-08-23: ~420 queued jobs, ~285 of them
    # created before the production image build, draining at ~18.5 jobs/h against ~48-62 jobs/h
    # of arrivals. Because this workflow also sets cancel-in-progress, the queue lag (2h46m)
    # exceeded the push cadence to main (~1h48m) and EVERY run was killed by its successor
    # before a runner ever reached it - the prod image lane was dead for ~10 hours.
    # x64-16 (maxRunners=5) is referenced by no other workflow and was completely idle.
    # The chain falls back to x64-4 and then ubuntu-latest, so nothing breaks if the
    # variable is unset.
    # 🛑 x64-8, NOT x64-16 — because x64-16 is currently unschedulable, not merely busy.
    #
    # Measured 2026-08-24 11:26Z: all five `ever-works-linux-x64-16` pods `Pending`
    # (two for 3h38m / 3h44m) on `Insufficient cpu/memory`, while eight
    # `ever-works-linux-x64-8` pods were `2/2 Running` with visible turnover
    # (ages 8m / 14m / 15m alongside 3h). That is the distinction that matters:
    # x64-8 is CONTENDED BUT ALIVE, x64-16 is DEAD. Queueing behind runners that
    # cycle resolves; waiting on pods that never schedule does not. Four hours of
    # 0/4 jobs started, twice, held a production credit-ledger fix AND a login
    # outage fix out of prod.
    #
    # The tier delta is only memory REQUEST: x64-16 asks 1 CPU/12Gi, x64-8 asks
    # 1 CPU/8Gi. This workflow ran on x64-4 (6Gi) until `c447c3417` moved it, and
    # that move was to escape a JAMMED pool, not because the build needed 12Gi —
    # so 8Gi is amply evidenced.
    #
    # ⚠️ Honest risk, not a free win: `work` (16Gi) and `docker-storage` (32Gi) are
    # still `emptyDir medium=Memory`, and their sizeLimits do NOT shrink with the
    # tier. Lowering the request lowers the GUARANTEE, not the usage, so a heavy
    # layer could push the pod past its request and be evicted mid-build. That
    # failure reads as "the repoint did not work" — so it must be watched for
    # explicitly (Evicted/OOMKilled), never inferred from a job merely starting.
    #
    # REVERT when x64-16 has capacity again: restore `vars.RUNNER_LINUX_X64_16` as
    # the first term. The fallback chain is CONFIG-time, not runtime — it will
    # never move off a pool that cannot schedule, which is why this needed an edit
    # rather than resolving itself.
    runs-on: ${{ vars.RUNNER_LINUX_X64_8 || vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: ever-works-api
            dockerfile: .deploy/docker/api/Dockerfile
            context: .
            pkg: apps/api/package.json
          - image: ever-works-web
            dockerfile: .deploy/docker/web/Dockerfile
            context: .
            pkg: apps/web/package.json
          - image: ever-works-mcp
            dockerfile: .deploy/docker/mcp/Dockerfile
            context: .
            pkg: apps/mcp/package.json
          # docs.ever.works (Docusaurus). Was served from a stale ever-works-docs
          # image that no active workflow rebuilt; build it here so it gets fresh
          # :prod + sha-<sha> tags (docs-ever-works-prod ArgoCD app tracks :prod by digest).
          - image: ever-works-docs
            dockerfile: .deploy/docker/docs/Dockerfile
            context: .
            pkg: apps/docs/package.json
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4.2.0
      - uses: docker/login-action@v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: t
        run: |
          set -uo pipefail
          case "${GITHUB_REF_NAME}" in
            develop) MOVING=dev ;;
            stage) MOVING=stage ;;
            main|master) MOVING=prod ;;
            *) MOVING="${GITHUB_REF_NAME//\//-}" ;;
          esac
          echo "tag=${MOVING}" >> "$GITHUB_OUTPUT"

          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER}/${MATRIX_IMAGE}"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          {
            echo "tags<<__TAGS__"
            echo "${IMAGE}:sha-${GITHUB_SHA}"
            echo "__TAGS__"
          } >> "$GITHUB_OUTPUT"
        env:
          MATRIX_IMAGE: ${{ matrix.image }}
      # Build/release identity baked into the images so the app footer shows a
      # real version + commit link + build time (web NEXT_PUBLIC_* are inlined by
      # next build; api/mcp read BUILD_*/GIT_* at runtime). Without this the
      # footer degrades to "v0.0.0 · dev" with no commit link.
      - id: meta
        run: |
          VERSION=$(grep -m1 '"version"' "${{ matrix.pkg }}" | sed -E 's/.*"version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/')
          echo "version=${VERSION:-0.0.0}" >> "$GITHUB_OUTPUT"
          echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      # First build + push attempt. ghcr.io can return `403 Forbidden` on the
      # blob HEAD for TWO different reasons, which need different fixes:
      #
      #   1. PERMISSION — the GHCR package is not linked to this repository
      #      (`repository: NONE`), so GITHUB_TOKEN has no write access to it.
      #      This fails on EVERY run, always the same image, and the retry
      #      below CANNOT fix it. The package has to be connected to the repo
      #      in the GitHub UI (Package settings -> Connect repository); there
      #      is no REST endpoint for it with our scopes. This is exactly what
      #      was wrong with `ever-works-docs` until it was linked 2026-07-20,
      #      after which the build went green first try on an unmodified
      #      GITHUB_TOKEN.
      #   2. TRANSIENT — a genuine registry rate-limit / session race when
      #      several matrix images push concurrently under the same
      #      GITHUB_TOKEN. The tell is that a DIFFERENT image fails on each
      #      run (web+docs one build, mcp+docs the next). The retry below
      #      does fix this one.
      #
      # So we don't fail the job on the first attempt; we back off and retry.
      # The build layers are cached by `cache-to` on the first pass, so the
      # retry only re-pushes and is fast.
      #
      # If the SAME image fails both attempts on consecutive runs, stop
      # retrying and check the package link — that is case (1), not (2).
      - id: buildpush
        uses: docker/build-push-action@v7.3.0
        continue-on-error: true
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            NODE_ENV=production
            VERDACCIO_REGISTRY=${{ vars.VERDACCIO_REGISTRY }}
            BUILD_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}
            BUILD_RUN=${{ github.run_number }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
            NEXT_PUBLIC_BUILD_VERSION=${{ steps.meta.outputs.version }}
            NEXT_PUBLIC_BUILD_SHA=${{ github.sha }}
            NEXT_PUBLIC_BUILD_REF=${{ github.ref_name }}
            NEXT_PUBLIC_BUILD_RUN=${{ github.run_number }}
            NEXT_PUBLIC_BUILD_TIME=${{ steps.meta.outputs.build_time }}
          # Build only the immutable tag. A final post-build step promotes the
          # moving env tag after re-reading the branch tip, closing the hours-long
          # check-then-build race.
          tags: ${{ steps.t.outputs.tags }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache,mode=max
      # Back off to let the transient ghcr rate-limit window clear.
      - if: steps.buildpush.outcome == 'failure'
        run: sleep 45
      # Retry (cached build → push-only, fast). This step is NOT
      # continue-on-error, so a genuine/persistent failure still fails the job.
      - if: steps.buildpush.outcome == 'failure'
        uses: docker/build-push-action@v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            NODE_ENV=production
            VERDACCIO_REGISTRY=${{ vars.VERDACCIO_REGISTRY }}
            BUILD_VERSION=${{ steps.meta.outputs.version }}
            GIT_SHA=${{ github.sha }}
            GIT_REF=${{ github.ref_name }}
            BUILD_RUN=${{ github.run_number }}
            BUILD_TIME=${{ steps.meta.outputs.build_time }}
            NEXT_PUBLIC_BUILD_VERSION=${{ steps.meta.outputs.version }}
            NEXT_PUBLIC_BUILD_SHA=${{ github.sha }}
            NEXT_PUBLIC_BUILD_REF=${{ github.ref_name }}
            NEXT_PUBLIC_BUILD_RUN=${{ github.run_number }}
            NEXT_PUBLIC_BUILD_TIME=${{ steps.meta.outputs.build_time }}
          # Build only the immutable tag; promotion happens after this retry too.
          tags: ${{ steps.t.outputs.tags }}
          cache-from: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:buildcache,mode=max

      # 🛑 Re-check only AFTER the hours-long build has published its immutable
      # sha tag. Checking before the build is a TOCTOU bug: a newer commit can
      # arrive during the build and make the old "I am tip" answer stale before
      # the tag is pushed, recreating the silent rollback this guard prevents.
      - name: Promote the moving tag only from the current branch tip
        env:
          IMAGE: ${{ steps.t.outputs.image }}
          MOVING: ${{ steps.t.outputs.tag }}
        run: |
          set -euo pipefail

          TIP=""
          for attempt in 1 2 3; do
            if TIP="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" 2>/dev/null | cut -f1)" && [ -n "${TIP}" ]; then
              break
            fi
            echo "::warning::Could not resolve ${GITHUB_REF_NAME} tip (attempt ${attempt}/3)."
            TIP=""
            sleep 5
          done

          # Fail closed and loudly. The immutable image is already published,
          # but an unverified build must never move an ArgoCD-tracked tag.
          if [ -z "${TIP}" ]; then
            echo "::error::Cannot prove the current ${GITHUB_REF_NAME} tip; leaving ${IMAGE}:${MOVING} unchanged."
            exit 1
          fi
          if [ "${TIP}" != "${GITHUB_SHA}" ]; then
            echo "::warning::${GITHUB_REF_NAME} advanced to ${TIP}; leaving ${IMAGE}:${MOVING} for that build."
            exit 0
          fi

          docker buildx imagetools create \
            --tag "${IMAGE}:${MOVING}" \
            "${IMAGE}:sha-${GITHUB_SHA}"
