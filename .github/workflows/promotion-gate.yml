name: Promotion Gate

# Refuses to let `stage` reach `main` while stage's own E2E result is unknown or
# red — unless a human explicitly overrides, on the record.
#
# Why this exists. On 2026-08-09 the E2E suite DID catch a defect that made
# registration impossible: `auth.spec.ts › Registration › should register a new
# user` failed because the consent checkbox rendered `disabled`. That run
# completed on `stage` at 23:29, BEFORE the stage → main promotion. The
# promotion went ahead anyway, because the only thing consulted was
# `lint-and-test` (the required check) plus health endpoints, and the release
# shipped a broken signup to production.
#
# The gap was never coverage. The gate existed and nothing made anyone look at
# it. This makes not-looking impossible.
#
# On the chronic-red problem. This suite carries pre-existing failures unrelated
# to any given change, so a plain "must be all green" bar would block every
# promotion and be routed around within a week — which is exactly how a signal
# dies. So the gate is a FORCED DECISION, not a hard block: it fails with the
# failing spec list in the log, and a maintainer who has read that list applies
# the `override-e2e-gate` label to proceed. The override is deliberate,
# attributable, and visible in the PR timeline.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  e2e-result:
    name: stage E2E must be green (or explicitly overridden)
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    timeout-minutes: 10
    # Only gate promotions from stage. Hotfix branches targeting main directly
    # are a different conversation and are not covered here.
    if: github.event.pull_request.head.ref == 'stage'

    steps:
      - name: Evaluate the E2E result for the exact commit being promoted
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          REPO: ${{ github.repository }}
          OVERRIDDEN: ${{ contains(github.event.pull_request.labels.*.name, 'override-e2e-gate') }}
        run: |
          set -uo pipefail

          echo "Promoting commit: $HEAD_SHA"

          # 🛑 DO NOT reintroduce `gh` here. This job runs on a SELF-HOSTED ARC
          # runner (vars.RUNNER_LINUX_X64_4) whose image is built from the minimal
          # ghcr.io/actions/actions-runner and does NOT ship the gh CLI — only
          # curl/jq/node. `gh` is preinstalled on ubuntu-latest, which is why this
          # never showed up in review.
          #
          # The old lookup was:
          #     RUN=$(gh api "..." --jq '...' 2>/dev/null || echo "")
          # so `gh: command not found` was swallowed by 2>/dev/null, `|| echo ""`
          # produced an empty RUN, and the gate reported "No E2E run found" on
          # EVERY promotion — including one where the E2E had already completed
          # RED (run 32950358018, 2026-08-27). The gate could then only be
          # satisfied by the override label, so the protection added after the
          # 2026-08-09 signup outage was silently doing nothing.
          #
          # Rule this encodes: a FAILED lookup and a MISSING run must never render
          # identically. One is a broken gate, the other is a real answer.
          api() { # $1 = path under /repos/{owner}/{repo}
            curl -sS -w '\n%{http_code}' \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/$REPO/$1"
          }

          RAW=$(api "actions/workflows/e2e.yml/runs?head_sha=$HEAD_SHA&per_page=1")
          CURL_RC=$?
          CODE=$(printf '%s' "$RAW" | tail -n1)
          BODY=$(printf '%s' "$RAW" | sed '$d')

          if [ "$CURL_RC" -ne 0 ] || [ "$CODE" != "200" ]; then
            echo "::error::E2E LOOKUP FAILED (curl rc=$CURL_RC, http=$CODE) — this is a BROKEN GATE, not a verdict."
            echo "The gate could not ask GitHub whether an E2E run exists, so it knows nothing"
            echo "about $HEAD_SHA either way. Do not read this as 'no run'."
            echo "Response head: $(printf '%s' "$BODY" | head -c 300)"
            [ "$OVERRIDDEN" = "true" ] && { echo "::warning::override-e2e-gate label present — allowing despite a BROKEN LOOKUP."; exit 0; }
            exit 1
          fi

          TOTAL=$(printf '%s' "$BODY" | jq -r '.total_count // 0')
          RUN=$(printf '%s' "$BODY" | jq -c '.workflow_runs[0] // empty')

          if [ "$TOTAL" = "0" ] || [ -z "$RUN" ]; then
            echo "::error::No E2E run found for $HEAD_SHA (lookup succeeded, http 200, total_count=$TOTAL)."
            echo "The suite runs on push to stage. If it has not started yet, wait for it."
            echo "Promoting a commit whose E2E result is unknown is what shipped the"
            echo "2026-08-09 signup outage."
            [ "$OVERRIDDEN" = "true" ] && { echo "::warning::override-e2e-gate label present — allowing."; exit 0; }
            exit 1
          fi

          STATUS=$(printf '%s' "$RUN"     | jq -r '.status')
          CONCLUSION=$(printf '%s' "$RUN" | jq -r '.conclusion // ""')
          RUN_ID=$(printf '%s' "$RUN"     | jq -r '.id')
          URL=$(printf '%s' "$RUN"        | jq -r '.html_url')

          echo "E2E run $RUN_ID: $STATUS/$CONCLUSION"
          echo "$URL"

          # Shard breakdown, printed for EVERY outcome. GitHub reports the parent
          # run as `queued` for a long time while shards are already finishing, so
          # "still queued" on its own is not actionable — the counts show whether
          # it is genuinely stuck or nearly done.
          shard_breakdown() {
            local raw code body
            raw=$(api "actions/runs/$RUN_ID/jobs?per_page=100")
            code=$(printf '%s' "$raw" | tail -n1)
            body=$(printf '%s' "$raw" | sed '$d')
            if [ "$code" != "200" ]; then
              echo "  (shard breakdown unavailable: http $code)"
              return
            fi
            printf '%s' "$body" | jq -r '
              "  status:    " + ([.jobs[] | .status] | group_by(.) | map("\(.[0])=\(length)") | join("  ")),
              "  concluded: " + ([.jobs[] | select(.conclusion != null) | .conclusion] | group_by(.) | map("\(.[0])=\(length)") | join("  "))'
            printf '%s' "$body" | jq -r '.jobs[] | select(.conclusion=="failure") | "  failing shard: \(.name)"'
          }

          if [ "$STATUS" != "completed" ]; then
            echo "::error::E2E for $HEAD_SHA is still $STATUS. Wait for it to finish."
            echo "::group::Shard progress for run $RUN_ID"
            shard_breakdown
            echo "::endgroup::"
            [ "$OVERRIDDEN" = "true" ] && { echo "::warning::override-e2e-gate label present — allowing."; exit 0; }
            exit 1
          fi

          if [ "$CONCLUSION" = "success" ]; then
            echo "E2E is green for the commit being promoted."
            exit 0
          fi

          # Red. Surface WHICH specs failed so the override decision is informed
          # rather than reflexive — a maintainer should be able to tell a
          # pre-existing failure from a new one without opening 33 shard logs.
          echo "::group::Failing specs in E2E run $RUN_ID"
          shard_breakdown
          echo "::endgroup::"

          echo "::error::E2E concluded '$CONCLUSION' for $HEAD_SHA — see $URL"
          echo ""
          echo "This suite carries known pre-existing failures. If you have read the run"
          echo "and the failures are unrelated to this promotion, apply the label"
          echo "'override-e2e-gate' to proceed. That override is recorded on the PR."

          if [ "$OVERRIDDEN" = "true" ]; then
            echo "::warning::override-e2e-gate label present — promotion allowed despite a red E2E."
            exit 0
          fi
          exit 1

  # W (EW-779) — the node↔platform wire contract, re-run against the exact
  # commit being promoted.
  #
  # Why a promotion needs its own copy of a check that already runs on every
  # PR: the fleet that builds this repo is dispatched BY this repo. A contract
  # regression that reaches production takes all six machines out at once, and
  # the fix then has to travel develop -> stage -> main through `k8s-build`
  # (215-243 minutes, `cancel-in-progress: false`) on the machines that just
  # stopped. The commit on `stage` is not necessarily any commit CI has judged
  # as a unit — merges happen — so the promotion asks the question again about
  # the thing actually shipping.
  #
  # HOW THIS DIFFERS FROM `e2e-result` ABOVE, deliberately:
  #
  #   - No `override-e2e-gate` escape. That label exists because the E2E suite
  #     carries chronic, unrelated failures, so a hard block would be routed
  #     around within a week. This suite has no such problem: it is fast,
  #     hermetic (no browser, no database, no network) and green by
  #     construction. An override here would only ever be used to ship the
  #     outage it exists to prevent.
  #   - No `if:` at all. `e2e-result` gates only promotions from `stage`; this
  #     runs on every PR into main, hotfixes included — a hotfix is exactly
  #     when someone changes a fleet DTO in a hurry. And in branch protection a
  #     SKIPPED job reports as SUCCESS, so every condition here is a hole: a
  #     red run followed by a label toggle would flip the gate green.
  #
  # Like `e2e-result`, being red is only advisory until this check is added to
  # the branch-protection list in repository settings. The genuinely-required
  # half is that these same specs run inside `pnpm test` under `lint-and-test`
  # (see ci.yml), which IS required today.
  node-contract:
    name: node contract must hold for the commit being promoted
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    timeout-minutes: 20

    permissions:
      contents: read

    steps:
      - name: Checkout the exact commit being promoted
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86  # v3
        with:
          version: 10.33.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: 'pnpm'

      # Same Verdaccio-or-npmjs resolution every other install job uses; the
      # ARC pool image does not ship `gh`, but it does have node + pnpm once
      # these two actions have run.
      - name: Configure Registry
        uses: ./.github/actions/configure-registry
        with:
          verdaccio-registry: ${{ vars.VERDACCIO_REGISTRY }}
          verdaccio-token: ${{ secrets.VERDACCIO_TOKEN }}
          force-public: ${{ vars.VERDACCIO_FORCE_PUBLIC }}
          expect-vip: ${{ vars.RUNNER_LINUX_X64_4 != '' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Contracts — fleet wire types and the package inventory guard
        run: pnpm --filter @ever-works/contracts test

      - name: Platform side — the DTOs still accept what a deployed node sends
        run: pnpm --filter ever-works-api exec jest --testPathPattern="fleet/__tests__/node-contract"

      # `apps/node` is the ONE exception to the note above. Its vitest resolves
      # `@ever-works/contracts` through the package ENTRY, not through source,
      # so the spec below cannot even load without a dist — it reports
      # "Failed to resolve entry for package" and zero tests. It passed once on
      # a warm self-hosted runner that still had a dist lying about from another
      # job, which is exactly the accident a gate must never depend on.
      - name: Build contracts for the node side
        run: pnpm --filter @ever-works/contracts build

      - name: Node side — the client still sends what the contract pins
        run: pnpm --filter ever-works-node exec vitest run src/core/node-contract.conformance.spec.ts src/core/api-base.spec.ts

      - name: Explain a failure in the terms a promotion decision needs
        if: failure()
        run: |
          echo "::error::NODE CONTRACT BROKEN on the commit being promoted."
          echo "The failing case names the DIRECTION:"
          echo "  PLATFORM TOO NEW - the API now requires something every deployed node"
          echo "    omits. Promoting this stops the whole fleet at once, and the fix has"
          echo "    to travel develop -> stage -> main through k8s-build (215-243 min)"
          echo "    on the machines that just stopped. DO NOT PROMOTE."
          echo "  NODE TOO OLD - a field a running node still sends was removed from a"
          echo "    node-facing DTO. whitelist + forbidNonWhitelisted makes that a 400,"
          echo "    not a silent drop, so it is equally fleet-wide."
          echo ""
          echo "There is no override label for this gate, on purpose. If the contract"
          echo "change is intended, the fixture in packages/contracts/fixtures/ has to be"
          echo "updated in the same PR that changes the DTO, and the break-glass runbook"
          echo "(docs/runbooks/FLEET_BREAK_GLASS.md) tells you how to keep the fleet"
          echo "working across the change."
          exit 1
