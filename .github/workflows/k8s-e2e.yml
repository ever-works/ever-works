name: K8s Plugin E2E

# Spins up a kind cluster and runs `@ever-works/k8s-plugin`'s e2e suite
# (`packages/plugins/k8s/src/__tests__/e2e/`) against it. The unit suite
# in CI already covers ~133 hermetic test cases; this job catches the
# things mocks can't:
#   - real `@kubernetes/client-node` ESM import path (createRequire)
#   - server-side apply field-manager semantics
#   - actual IngressClass schema across cluster versions
#   - rollout-status mapping against a real Deployment
#
# Scope: only the release branches stage / main, and only when files
# that could affect the runtime path change. PR and develop triggers
# were removed in 2026-05-27 (see
# Workspace/knowledge/runbooks/CI_RELEASE_GATES.md) â€” kind-cluster
# provisioning is expensive, so we restrict to release gates.

on:
  push:
    branches: [stage, main]
    paths:
      - 'packages/plugins/k8s/**'
      - '.github/workflows/k8s-e2e.yml'
  workflow_dispatch:

# M-12: minimum default permissions. Individual jobs can elevate where needed.
permissions:
  contents: read

concurrency:
  # On stage/main the workflow can take 5+ minutes to spin up the kind
  # cluster â€” if a second push lands while the first is still in setup,
  # cancelling it shows "FAILURE" after 2-3 seconds, indistinguishable
  # from a real test failure unless you click into the logs. Let
  # branch-push runs finish so their result is a real signal.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ${{ vars.RUNNER_LINUX_X64_4 || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        # Each Kubernetes version we want to keep working. kind images
        # come from kubernetes-sigs/kind release notes â€” bump versions
        # here when we promote a new floor.
        kubernetes:
          - { version: 'v1.28', image: 'kindest/node:v1.28.15' }
          - { version: 'v1.30', image: 'kindest/node:v1.30.13' }
        # Whether ingress-nginx is installed in the cluster â€” exercises
        # both the "no ingress controller" and "nginx detected" paths
        # in `validateConnection.listIngressClasses`.
        ingress: [false, true]

    name: e2e (k8s ${{ matrix.kubernetes.version }} / ingress=${{ matrix.ingress }})

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271  # v3
        with:
          version: 10.33.3

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      # Resolve dependencies through the internal Verdaccio cache when this job runs
      # on the in-network ARC pool, so the install does not re-pull the tree from the
      # public registry. Falls back to npmjs automatically when the VIP does not answer.
      - name: Configure Registry
        uses: ./.github/actions/configure-registry
        with:
          verdaccio-registry: ${{ vars.VERDACCIO_REGISTRY }}
          verdaccio-token: ${{ secrets.VERDACCIO_TOKEN }}
          force-public: ${{ vars.VERDACCIO_FORCE_PUBLIC }}
          expect-vip: ${{ vars.RUNNER_LINUX_X64_4 != '' }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build k8s plugin and its workspace deps
        # `@ever-works/k8s-plugin...` builds k8s and every upstream
        # workspace dep (contracts, plugin, agent). Without `contracts`,
        # the plugin's dts build can't resolve `@ever-works/contracts`
        # imports. Cheaper than a full `pnpm build`.
        run: pnpm --filter '@ever-works/k8s-plugin...' build

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc  # v1
        with:
          cluster_name: ever-works-e2e
          node_image: ${{ matrix.kubernetes.image }}
          wait: 120s

      - name: Install ingress-nginx
        if: matrix.ingress == true
        # Pin to a specific controller release tag â€” using `main` makes
        # the cluster state non-deterministic across runs (a breaking
        # change merged to main would silently alter behaviour without a
        # diff in this repo). Bump this tag deliberately when promoting
        # a new floor.
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.11.3/deploy/static/provider/kind/deploy.yaml
          # The controller takes ~30s to become Ready; we don't need it
          # to be Ready for the test (we only enumerate IngressClass
          # resources), but we wait so the suite reports realistic state.
          kubectl wait --namespace ingress-nginx \
              --for=condition=ready pod \
              --selector=app.kubernetes.io/component=controller \
              --timeout=180s || echo "ingress-nginx not Ready in time â€” continuing anyway, IngressClass should still resolve"

      - name: Export kubeconfig for e2e suite
        run: |
          kind get kubeconfig --name ever-works-e2e > "$RUNNER_TEMP/kubeconfig"
          chmod 600 "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG_E2E_PATH=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Pre-pull image used by e2e Deployment
        # Loads nginx-unprivileged into the kind node so the Deployment's
        # imagePullPolicy: IfNotPresent path resolves immediately,
        # cutting test time by ~30s on slow runners.
        #
        # Why `crictl pull` INSIDE the node instead of `kind load docker-image`:
        # on the self-hosted ARC pool the `docker:dind` sidecar runs Docker 29,
        # whose fresh-install default is the containerd image store. There
        # `docker save` (what `kind load docker-image` shells out to) writes the
        # image's FULL multi-arch OCI index but only the blobs that were actually
        # pulled, and the node-side `ctr images import --all-platforms` fails with
        # `ctr: content digest sha256:…: not found` for the linux/arm manifest.
        # `docker save --platform linux/amd64` is not enough either: the archive
        # still carries the amd64 *attestation* manifest (unknown/unknown), which
        # ctr then tries to unpack as an image and rejects with `mismatched image
        # rootfs and manifest layers`. That made every run of this workflow red
        # from 2026-07-17 on (the GitHub-hosted runners it ran on before use the
        # classic overlay2 store, where `docker save` is self-contained).
        # Upstream: kubernetes-sigs/kind#3795 (pinned, open — kind cannot fix it
        # on its side), containerd/containerd#11344.
        # Pulling through the node's own CRI fetches exactly what the kubelet
        # would fetch (one platform, no attestations) and is independent of the
        # host daemon's image store, so it behaves the same on ubuntu-latest and
        # on ARC. The `docker info` line records the daemon mode in every run.
        run: |
          IMAGE=nginxinc/nginx-unprivileged:1.27-alpine
          docker info --format 'docker {{.ServerVersion}} / storage {{.Driver}} {{range .DriverStatus}}{{index . 0}}={{index . 1}} {{end}}'
          docker exec ever-works-e2e-control-plane crictl pull "docker.io/$IMAGE"
          # Prove the image is on the node — a loud failure here beats a silent
          # fallback to a registry pull inside the test.
          docker exec ever-works-e2e-control-plane crictl images | grep -F 'nginxinc/nginx-unprivileged'             || { echo "::error::$IMAGE not present on the kind node after pull"; exit 1; }

      - name: Run k8s plugin e2e suite
        run: pnpm --filter @ever-works/k8s-plugin test:e2e

      - name: Show cluster state on failure
        if: failure()
        run: |
          kubectl get nodes -o wide || true
          kubectl get ingressclass -o wide || true
          kubectl get all -A | head -100 || true
          kubectl describe deployment -A | head -200 || true

      - name: Tear down kind cluster
        if: always()
        run: kind delete cluster --name ever-works-e2e || true

