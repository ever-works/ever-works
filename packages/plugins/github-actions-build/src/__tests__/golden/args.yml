# Generated by Ever Works from .works/works.yml. Do not edit: hand edits are never overwritten;
# Ever Works proposes changes to this file as pull requests.
# ever-works-build generator=1 inputs=sha256:762385972194c3e9ed9c0fbc9301479a297ac4e38314e03a88ea5929c528b4d2
name: Ever Works build
run-name: "Ever Works build ${{ inputs.ew_build_id || github.event.pull_request.head.sha || github.sha }}"
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      ew_build_id:
        type: string
        required: true
      ew_sha:
        type: string
        required: true
      ew_mode:
        type: choice
        options: [build, verify]
        default: build
      ew_verify_plan:
        type: string
        required: false
        default: ""
      ew_reuse_digest:
        type: string
        required: false
        default: ""
permissions: {}
concurrency:
  group: "${{ inputs.ew_mode == 'verify' && format('verify-{0}', inputs.ew_build_id) || format('ever-works-build-{0}', github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name) }}"
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    if: (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && inputs.ew_mode != 'verify'
    runs-on: "ubuntu-latest"
    timeout-minutes: 30
    permissions: { contents: read, packages: write }
    env:
      EW_IMAGE: "ghcr.io/ever-works/fixture-app/ever-works-app"
      EW_SHA: "${{ inputs.ew_sha || github.event.pull_request.head.sha || github.sha }}"
      EW_SECRET_NAMES: "EW_SENTRY_DSN"
    steps:
      - name: Check build values
        if: github.event_name != 'pull_request'
        env:
          EW_SENTRY_DSN: "${{ secrets.EW_SENTRY_DSN }}"
          EW_DATABASE_URL: "${{ secrets.EW_DATABASE_URL }}"
        run: |
          set -euo pipefail
          for name in EW_SENTRY_DSN EW_DATABASE_URL; do
            [ -n "${!name:-}" ] || { echo "EW_MISSING:${name#EW_}"; exit 78; }
          done
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ env.EW_SHA }}"
          fetch-depth: 1
          persist-credentials: false
          lfs: false
      - name: Reclaim runner disk
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"
      - id: build
        if: inputs.ew_mode != 'verify'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: "."
          file: "./Dockerfile"
          load: true
          push: false
          provenance: false
          build-args: |
            NODE_ENV=production
            SENTRY_DSN=${{ github.event_name == 'pull_request' && 'ew-restricted' || secrets.EW_SENTRY_DSN }}
            DATABASE_URL=${{ github.event_name == 'pull_request' && 'ew-restricted' || secrets.EW_DATABASE_URL }}
          tags: |
            ${{ env.EW_IMAGE }}:sha-${{ env.EW_SHA }}
            ${{ env.EW_IMAGE }}:${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'branch-main' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ env.EW_SHA }}
            io.ever-works.app-spec-hash=7f3c1d9e5b2a4806c1d7e9f0a2b4c6d8e0f1a3b5c7d9e1f2a4b6c8d0e2f4a6b8
          cache-from: type=registry,ref=${{ env.EW_IMAGE }}:buildcache
          cache-to: ${{ github.event_name == 'push' && format('type=registry,ref={0}:buildcache,mode=max', env.EW_IMAGE) || '' }}
      - name: Check the image for secret build values
        id: secretcheck
        if: inputs.ew_mode != 'verify'
        env:
          EW_SENTRY_DSN: "${{ secrets.EW_SENTRY_DSN }}"
        run: |
          set -euo pipefail
          docker image inspect "$EW_IMAGE:sha-$EW_SHA" > "$RUNNER_TEMP/ew-image.json"
          docker history --no-trunc --format '{{.CreatedBy}}' "$EW_IMAGE:sha-$EW_SHA" >> "$RUNNER_TEMP/ew-image.json"
          for name in $EW_SECRET_NAMES; do
            value="${!name:-}"
            [ "${#value}" -ge 8 ] || continue
            if grep -qF -- "$value" "$RUNNER_TEMP/ew-image.json"; then echo "EW_SECRET_IN_IMAGE:${name#EW_}"; exit 79; fi
          done
          echo "secret-check: passed"
      - name: Push
        if: inputs.ew_mode != 'verify'
        run: |
          docker push --all-tags "$EW_IMAGE"
          docker image inspect --format '{{index .RepoDigests 0}}' "$EW_IMAGE:sha-$EW_SHA" > ew-digest.txt
      - name: Verify in the runner
        if: inputs.ew_verify_plan != ''
        timeout-minutes: 30
        run: |
          set -euo pipefail
          echo "EW_VERIFY_NOT_IMPLEMENTED: the runner verification script is not embedded yet (APW-05 T15, plan §4.10)." >&2
          exit 70
      - name: Write result
        if: always()
        run: |
          set -euo pipefail
          digest=""
          [ ! -f ew-digest.txt ] || digest="$(tr -d '[:space:]' < ew-digest.txt)"
          secret_check="not_needed"
          if [ -n "$EW_SECRET_NAMES" ]; then
            secret_check="passed"
            [ "${{ steps.secretcheck.outcome }}" != "failure" ] || secret_check="failed"
          fi
          jq -n --arg buildId "${{ inputs.ew_build_id }}" --arg sha "$EW_SHA" \
            --arg imageRepository "$EW_IMAGE" --arg digest "$digest" --arg secretCheck "$secret_check" \
            --arg tag "$EW_IMAGE:sha-$EW_SHA" \
            '{schema:"ever-works-build-result",version:1,buildId:$buildId,sha:$sha,imageRepository:$imageRepository,'
              digest:$digest,tags:[$tag],secretCheck:$secretCheck,verification:{jobs:[],smoke:[]}}' > ever-works-build-result.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: "ever-works-build-result"
          path: "ever-works-build-result.json"
          retention-days: 7
          if-no-files-found: ignore
  verify:
    if: github.event_name == 'workflow_dispatch' && inputs.ew_mode == 'verify'
    runs-on: "ubuntu-latest"
    timeout-minutes: 60
    permissions: { contents: read, packages: read }
    env:
      EW_IMAGE: "ghcr.io/ever-works/fixture-app/ever-works-app"
      EW_SHA: "${{ inputs.ew_sha }}"
      EW_REUSE_DIGEST: "${{ inputs.ew_reuse_digest }}"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: "${{ inputs.ew_sha }}"
          fetch-depth: 1
          persist-credentials: false
          lfs: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: "${{ github.actor }}"
          password: "${{ secrets.GITHUB_TOKEN }}"
      - name: Take the image to verify
        run: |
          set -euo pipefail
          plan="$RUNNER_TEMP/ew-verify-plan.json"
          plan_b64="$(printf '%s' "${{ inputs.ew_verify_plan }}" | tr '_-' '/+')"
          case $(( ${#plan_b64} % 4 )) in 2) plan_b64="${plan_b64}==" ;; 3) plan_b64="${plan_b64}=" ;; esac
          printf '%s' "$plan_b64" | base64 -d > "$plan"
          printf 'EW_VERIFY_BUILD=%s\n' "$(jq -r '.build // empty | @base64' "$plan")" >> "$GITHUB_ENV"
          if [ -n "$EW_REUSE_DIGEST" ]; then
            docker pull "$EW_IMAGE@$EW_REUSE_DIGEST"
            exit 0
          fi
          [ -n "$EW_VERIFY_BUILD" ] || { echo "EW_VERIFY_NO_BUILD"; exit 78; }
          context="$(jq -r '.build.context // "."' "$plan")"
          dockerfile="$(jq -r '.build.dockerfile // "Dockerfile"' "$plan")"
          target="$(jq -r '.build.target // empty' "$plan")"
          buildx_args=(--load --file "$context/$dockerfile" --cache-from "$EW_IMAGE:buildcache" --tag ew-verify:local)
          if [ -n "$target" ]; then buildx_args+=(--target "$target"); fi
          while IFS= read -r entry; do
            [ -n "$entry" ] || continue
            buildx_args+=(--build-arg "$entry")
          done < <(jq -r '(.build.args // [])[] | select(.value != null) | "\(.name)=\(.value)"' "$plan")
          docker buildx build "${buildx_args[@]}" "$context"
      - name: Verify in the runner
        if: inputs.ew_verify_plan != ''
        timeout-minutes: 30
        run: |
          set -euo pipefail
          echo "EW_VERIFY_NOT_IMPLEMENTED: the runner verification script is not embedded yet (APW-05 T15, plan §4.10)." >&2
          exit 70
      - name: Write result
        if: always()
        run: |
          set -euo pipefail
          reused_digest="$EW_REUSE_DIGEST"
          local_build=true
          [ -z "$reused_digest" ] || local_build=false
          jq -n --arg buildId "${{ inputs.ew_build_id }}" --arg sha "$EW_SHA" \
            --arg imageRepository "$EW_IMAGE" --arg reusedDigest "$reused_digest" \
            --argjson localBuild "$local_build" \
            '{schema:"ever-works-build-result",version:1,buildId:$buildId,sha:$sha,imageRepository:$imageRepository,'
              reusedDigest:$reusedDigest,localBuild:$localBuild,verification:{jobs:[],smoke:[]}}' > ever-works-build-result.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: "ever-works-build-result"
          path: "ever-works-build-result.json"
          retention-days: 7
          if-no-files-found: ignore
