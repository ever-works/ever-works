server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Emit RELATIVE Location headers (`Location: /help/`) for nginx's own redirects,
    # e.g. the directory 301 that `try_files ... $uri/` issues for `/help` -> `/help/`.
    # nginx sits behind TLS-terminating proxies (Cloudflare -> ingress) and only ever
    # sees plain http on :80, so an absolute redirect came out as
    # `Location: http://docs.ever.works/help/` - an extra http:// hop that Cloudflare
    # then bounced back to https. Google Search Console reported the docs sitemap URLs
    # as "Page with redirect" because of it. A relative Location keeps the browser
    # (and Google's crawler) on the scheme and host it already used. The site itself
    # now links the slash form directly (`trailingSlash: true` in
    # apps/docs/docusaurus.config.ts), so this only governs residual redirects from
    # old slash-less links.
    absolute_redirect off;

    # Standard text-asset compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    # Long cache for hashed/static assets emitted by Docusaurus
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    # No cache for HTML so deploys ship instantly
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        try_files $uri =404;
    }

    # Serve clean URLs (Docusaurus emits both /foo/ and /foo/index.html)
    location / {
        try_files $uri $uri/ $uri.html $uri/index.html =404;
    }

    # Custom 404 page from Docusaurus
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
