# yaml-language-server: $schema=https://api.ever.works/api/schema/works.yml.schema.json
#
# DRAFT App Blueprint — seed content of `ever-works/app-fixture-hello-template` (APW-13).
# The application it runs, `ever-works/app-fixture-hello`, is purpose-built by APW-13 so that ONE App Work
# exercises every App spec feature in under three minutes of build time. Its design (endpoints, variant branches,
# timings) is in ../../plan.md §4; this file must stay in step with it.
#
# Shape: docs/specs/features/app-works/CONTRACTS.md §1, including the APW-13 additions.
# Every field below is exercised by at least one acceptance scenario; the scenario ids are in the comments.

version: 2
kind: app
name: App fixture (hello)

spec:
  source:
    relation: fork
    upstream: { repo: ever-works/app-fixture-hello, defaultBranch: main }
    branch: main # variant branches (variant/build-oom, variant/baked-localhost, …) are selected here by the harness

  blueprint:
    id: app-fixture-hello
    version: 0.1.0
    repo: ever-works/app-fixture-hello-template
    sha: '0000000000000000000000000000000000000000' # TODO(release): stamped by the Blueprint release workflow

  license:
    spdx: MIT
    class: green
    source: blueprint

  display:
    name: 'App fixture (hello)'
    protectedPaths: ['public/brand/**', LICENSE] # ACC-NEG-04

  build:
    strategy: dockerfile # ACC-E2E-05, ACC-13-01
    dockerfile: Dockerfile
    context: .
    target: runtime
    args:
      - { name: FIXTURE_BUILD_LABEL, fromEnv: FIXTURE_BUILD_LABEL } # a build-phase env value baked into the image
    resources: { cpu: 2, memory: 4Gi, timeoutMinutes: 10 }

  components:
    - name: web # ACC-E2E-05: Service + Ingress, probes, volume
      role: web
      command: ['node', 'src/server.mjs']
      port: 8080
      replicas: 1
      writableRootFilesystem: false # the fixture writes only to its volume
      probes:
        startup: { http: /healthz, periodSeconds: 2, failureThreshold: 30 }
        readiness: { http: /readyz } # 503 until the database is reachable and migrated
        liveness: { http: /healthz, periodSeconds: 20 }
      resources: { cpu: 50m, memory: 64Mi, memoryLimit: 128Mi }
      volumes: [{ name: uploads, path: /data, size: 1Gi, backup: false }]
    - name: worker # ACC-E2E-05: no Service, no Ingress; writes a heartbeat every 10 s
      role: worker
      command: ['node', 'src/worker.mjs']
      replicas: 1
      resources: { cpu: 25m, memory: 48Mi, memoryLimit: 96Mi }

  dependencies:
    postgres: { version: '16', directUrl: false }
    smtp: { required: true } # POST /mail/test sends to the prompted address; the lane reads the mail sink
    # The `all-dependencies` profile (plan §4.4) adds:  redis: { version: "7", maxmemoryPolicy: noeviction }
    #                                                    objectStorage: { buckets: [uploads] }

  env:
    - { name: DATABASE_URL, secret: true, from: deps.postgres.url }
    - { name: SMTP_HOST, from: deps.smtp.host } # TODO(verify, APW-07): smtp output names
    - { name: SMTP_PORT, from: deps.smtp.port }
    - { name: SMTP_USER, secret: true, from: deps.smtp.user }
    - { name: SMTP_PASSWORD, secret: true, from: deps.smtp.password }
    - { name: SMTP_FROM, from: deps.smtp.from }
    - { name: FIXTURE_PUBLIC_URL, from: domains.primary.url } # ACC-NEG-11 checks it is not baked in
    - { name: FIXTURE_INTERNAL_URL, from: components.web.internalUrl } # used by the first-deploy job
    - { name: FIXTURE_GIT_SHA, from: build.commitSha } # GET /marker → proves which commit is live
    - name: FIXTURE_MARKER # ACC-E2E-05: the harness supplies a run-unique value at creation
      prompt: { description: 'Any text; GET /marker returns it', required: true }
    - name: FIXTURE_MAIL_TO
      prompt: { description: 'Address POST /mail/test sends to', required: true }
    - name: FIXTURE_SESSION_SECRET # ACC-NEG-12: GET /state returns only its length and a hash prefix
      secret: true
      generate: { kind: chars, length: 32, rotate: never }
      validate: { length: 32 }
    - name: FIXTURE_CRON_TOKEN
      secret: true
      generate: { kind: hex, bytes: 32, rotate: never }
    - { name: FIXTURE_BUILD_LABEL, phase: build, value: 'fixture-blueprint-0.1.0' }

  jobs:
    - name: migrate # applies migrations/*.sql in order; exits non-zero on any failure (variant/bad-migration)
      when: pre-deploy
      component: web
      command: ['node', 'src/migrate.mjs']
      timeoutSeconds: 120
    - name: bootstrap # ACC-13-03: records whether the PUBLIC url already served this app (it must not have)
      when: first-deploy
      component: web
      command: ['node', 'src/bootstrap.mjs']
      timeoutSeconds: 120

  cron:
    - {
        name: tick,
        schedule: '*/2 * * * *',
        http: { method: POST, path: /cron/tick, authEnv: FIXTURE_CRON_TOKEN, authScheme: bearer }
      }

  domains:
    primaryComponent: web
    publicUrlEnv: [FIXTURE_PUBLIC_URL]
    onChange: restart
    needsHairpin: false

  smoke:
    - { name: healthz, http: { method: GET, path: /healthz }, expect: { status: [200] } }
    - { name: readyz, http: { method: GET, path: /readyz }, expect: { status: [200] } }
    - { name: marker, http: { method: GET, path: /marker }, expect: { status: [200], bodyNotContains: ['localhost'] } }
    - { name: cron-refuses-anonymous, http: { method: POST, path: /cron/tick }, expect: { status: [401] } }

  checks: # ACC-E2E-07: fast, deterministic; each installs its own dependencies (APW-08 plan §2.3) and runs as its own CI job (R-9)
    - { name: unit, command: 'npm ci && npm test', required: true, timeoutSeconds: 300 }
    - { name: format, command: 'npm ci && npm run format:check', required: false, timeoutSeconds: 180 }

  agents:
    instructionFiles: [AGENTS.md]
    maxPullRequestChangedLines: 200

  upstreamSync: # ACC-E2E-09
    schedule: '0 5 * * *'
    mode: merge

  upstreamPullRequests: # ACC-E2E-08 enables it on the test App Work only
    enabled: false
    requireApproval: true
