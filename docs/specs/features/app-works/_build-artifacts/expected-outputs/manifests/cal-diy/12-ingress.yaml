# GOLDEN RENDERED OUTPUT — cal-diy. Ingress `web` (APW-06 plan §4.11, §4.1 names table).
# Rendered ONLY for `domains.primaryComponent` (here `web`) and ONLY when a host list is non-empty and an
# ingress class exists (APW-06 plan §4.11: "No `Ingress` is rendered when no class exists and no default
# class was detected (warning `no_ingress_controller`, public smoke skipped)").
#
# Rules cover `hosts.primary ∪ hosts.extra ∪ hosts.previous`. For this pinned input:
#   primary   = cal-diy.apps.example.com   (the managed subdomain on Your cluster, R-16 / spec FR-41)
#   extra     = []                          (WorkCustomDomain rows are platform data, not App spec fields;
#                                            ACC-06-25/ACC-06-26 add `book.example.com` at runtime)
#   previous  = []                          (kept only while a `rebuild`-policy Deployment is pending)
#
# Annotations and the TLS block come from the existing `IngressStrategyRegistry` (APW-06 T6: "reuse
# `IngressStrategyRegistry`"), i.e. the nginx strategy for `ingress.className: nginx`:
#   nginx.ingress.kubernetes.io/proxy-body-size: 10m            (nginx.strategy.ts:4-5)
#   nginx.ingress.kubernetes.io/ssl-redirect: "true"            (nginx.strategy.ts:6-7, only with a tlsIssuer)
#   cert-manager.io/cluster-issuer: letsencrypt                 (nginx.strategy.ts:8-13)
#   TLS secretName = `<hosts[0] with [^a-z0-9] → '-'>-tls`      (nginx.strategy.ts:30-33)
# TLS is rendered ONLY for `ingress.tls: 'cert-manager'`; `external` and `none` render no TLS block
# (APW-06 plan §4.11, §4.12; T62; ACC-06-29). The host passed the strict RFC-1123 check used by `addDomain`
# (`normaliseIngressHost`, k8s.plugin.ts:1302-1309).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  namespace: ew-cal-diy-11111111
  labels:
    app.kubernetes.io/managed-by: ever-works-k8s-plugin
    app.kubernetes.io/part-of: cal-diy
    ever-works.io/work-id: 11111111-1111-4111-8111-111111111111
    ever-works.io/kind: app
    ever-works.io/component: web
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: 10m
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  rules:
    - host: cal-diy.apps.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
  tls:
    - hosts:
        - cal-diy.apps.example.com
      secretName: cal-diy-apps-example-com-tls
