# GOLDEN RENDERED OUTPUT — cal-diy. Service `web` (APW-06 plan §4.3, §4.1 names table).
# Only `role: web` components get a Service; `worker` components do not. Always `ClusterIP`, always
# `port 80 → targetPort <spec port>`, matching the existing site renderer's convention
# (`manifest.renderer.ts:192-205`) and APW-06's rule ("Web components get a ClusterIP Service port 80 →
# targetPort <spec port>", plan §4.3).
# This Service is also what `components.web.internalUrl` resolves to:
#   http://web.ew-cal-diy-11111111.svc.cluster.local   (APW-06 plan §4.3; CONTRACTS §1 APW-13 addition)
# which is why the first-deploy `bootstrap-admin` job can reach the app before any Ingress exists.
apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: ew-cal-diy-11111111
  labels:
    app.kubernetes.io/managed-by: ever-works-k8s-plugin
    app.kubernetes.io/part-of: cal-diy
    ever-works.io/work-id: 11111111-1111-4111-8111-111111111111
    ever-works.io/kind: app
    ever-works.io/component: web
spec:
  type: ClusterIP
  selector:
    ever-works.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: 3000
      protocol: TCP
