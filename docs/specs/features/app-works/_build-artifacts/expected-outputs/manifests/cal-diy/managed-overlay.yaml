# GOLDEN RENDERED OUTPUT — cal-diy, target "Ever Works Apps" — ONLY the objects that differ.
#
# Read this together with the target-neutral files in this directory: everything else (ServiceAccount, the
# five NetworkPolicies, the Secrets, the Service, the Ingress, the Jobs, the CronJobs, the runner ConfigMap)
# is rendered by the same renderer with the same inputs. This file carries the objects whose *content*
# changes, plus the object that exists only on this target.
#
# 🛑 WHO APPLIES THIS. On Ever Works Apps the platform NEVER applies a workload. APW-06 renders the App Work
# into desired state; the zone's controller renders with the same renderer and applies it (Resolution R-5;
# CONTRACTS.md:48; APW-10 spec FR-24 at APW-10/spec.md:284-286: "The platform never applies workloads to the
# tier"). The platform's own write is a `Work` object `w-<workId>` in the control namespace
# `ever-works-apps-control` (APW-10 plan §3.1, plan.md:222-248), not these manifests. `deployApp` for this
# target maps `AppRenderInput` to `Work.spec`; `destroyApp` calls `removeWork`.
#
# EVERYTHING BELOW IS IN THE ZONE'S TENANT NAMESPACE, WHOSE NAME THE ZONE OWNS:
#   status.namespace = ewa-<first 20 hex of workId>   (APW-10 plan.md:254)
#   → ewa-11111111111111111111 for this Work.
# This is NOT `ew-<slug>-<8hex>`: APW-06 plan §4.1's namespace rule and APW-10's are different names for the
# same thing. See ../contradictions.md **X-8**. A `Work` carrying a namespace field is refused
# (`NAMESPACE_FIELD_FORBIDDEN`, APW-10 plan.md:266).
---
# Namespace: pod security moves from `baseline` (enforce) to `restricted` (enforce), and the zone adds its own
# labels and the allowed-hosts annotation (APW-10 plan.md:320-322).
apiVersion: v1
kind: Namespace
metadata:
  name: ewa-11111111111111111111
  labels:
    app.kubernetes.io/managed-by: ever-works-k8s-plugin
    app.kubernetes.io/part-of: cal-diy
    ever-works.io/work-id: 11111111-1111-4111-8111-111111111111
    ever-works.io/kind: app
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
    hosting.ever.works/tenant: "true"
    hosting.ever.works/work-id: 11111111-1111-4111-8111-111111111111
  annotations:
    hosting.ever.works/allowed-hosts: '["cal-diy.apps.example.com"]'
---
# LimitRange: only the `max` per container changes (APW-06 plan §4.2: 2 CPU / 4Gi on `ever-works-apps`).
# APW-10 plan.md:333 states the managed default limit as 500m/512Mi where APW-06 states 1 CPU/512Mi —
# ../contradictions.md **X-9**. This file follows APW-06, the epic that owns the renderer.
apiVersion: v1
kind: LimitRange
metadata:
  name: ew-defaults
  namespace: ewa-11111111111111111111
  labels:
    app.kubernetes.io/managed-by: ever-works-k8s-plugin
    app.kubernetes.io/part-of: cal-diy
    ever-works.io/work-id: 11111111-1111-4111-8111-111111111111
    ever-works.io/kind: app
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: "1"
        memory: 512Mi
        ephemeral-storage: 1Gi
      max:
        cpu: "2"
        memory: 4Gi
---
# ResourceQuota: `ever-works-apps` ONLY — a 403 on Your cluster is irrelevant because it is not rendered
# there, and here a 403 is fatal (APW-06 plan §4.2). Values are APW-06 plan §4.2's defaults; APW-10 FR-47's
# per-profile numbers (Starter 1/2 CPU, 2/4 GiB, 10 pods …) differ — ../contradictions.md **X-10**.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ew-quota
  namespace: ewa-11111111111111111111
  labels:
    app.kubernetes.io/managed-by: ever-works-k8s-plugin
    app.kubernetes.io/part-of: cal-diy
    ever-works.io/work-id: 11111111-1111-4111-8111-111111111111
    ever-works.io/kind: app
spec:
  hard:
    requests.cpu: "2"
    limits.cpu: "4"
    requests.memory: 4Gi
    limits.memory: 6Gi
    pods: "20"
    persistentvolumeclaims: "5"
    requests.storage: 20Gi
    services.loadbalancers: "0"
    services.nodeports: "0"
    count/jobs.batch: "20"
    count/cronjobs.batch: "20"
    secrets: "30"
    configmaps: "30"
---
# Deployment `web` — the only difference from 10-deployments.yaml is `limits.cpu`, which the renderer fills
# from `max(1, 4 × resources.cpu)` on this target so the quota admits the pod (APW-06 plan §4.5):
# max(1, 4 × 0.5) = 2.
#
# NOT rendered here, applied by the ZONE on top of the rendered objects (APW-10 plan.md:336-344) — any
# conflicting rendered value is overwritten, never merged:
#   runtimeClassName: <zone sandbox class>        ← and `managed_sandbox_unavailable` blocks the target when
#                                                   the zone reports none (APW-06 plan §5.1, R-24)
#   priorityClassName: ever-works-apps-tenant
#   hostNetwork/hostPID/hostIPC: false
#   annotations kubernetes.io/egress-bandwidth / ingress-bandwidth from the quota profile
#   imagePullSecrets: [registry] and images rewritten to <zone registry>/t-<id>/<component>@sha256:…
#   pod securityContext / container securityContext re-forced (runAsNonRoot: true always)
# Those overlays are APW-10's and are NOT part of this renderer's output, so they are asserted by APW-10's
# own golden set, not this one.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  namespace: ewa-11111111111111111111
  labels:
    app.kubernetes.io/managed-by: ever-works-k8s-plugin
    app.kubernetes.io/part-of: cal-diy
    ever-works.io/work-id: 11111111-1111-4111-8111-111111111111
    ever-works.io/kind: app
    ever-works.io/component: web
spec:
  replicas: 1
  revisionHistoryLimit: 5
  progressDeadlineSeconds: 750
  minReadySeconds: 0
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      ever-works.io/component: web
  template:
    metadata:
      labels:
        ever-works.io/component: web
        app.kubernetes.io/managed-by: ever-works-k8s-plugin
        app.kubernetes.io/part-of: cal-diy
        ever-works.io/work-id: 11111111-1111-4111-8111-111111111111
        ever-works.io/kind: app
      annotations:
        ever-works.io/env-checksum: 3b2eee9155911d5d
        ever-works.io/build-commit: a1b2c3d4e5f60718293a4b5c6d7e8f9012345678
        ever-works.io/deployment-id: 33333333-3333-4333-8333-333333333333
    spec:
      serviceAccountName: app
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: app-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              ever-works.io/component: web
      containers:
        - name: web
          image: ghcr.io/example-owner/cal.diy/ever-works-app@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          imagePullPolicy: IfNotPresent
          command:
            - /calcom/scripts/start.sh
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          envFrom:
            - secretRef:
                name: app-env-3b2eee9155
                optional: false
            - configMapRef:
                name: app-platform-3b2eee9155
                optional: false
          startupProbe:
            httpGet:
              path: /api/version
              port: http
            initialDelaySeconds: 0
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /auth/login
              port: http
            initialDelaySeconds: 0
            timeoutSeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/version
              port: http
            initialDelaySeconds: 0
            timeoutSeconds: 5
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 500m
              memory: 1536Mi
            limits:
              cpu: "2"
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
---
# RENDER-TIME REFUSAL, not an object: on this target three of cal-diy's seven schedules can fire more often
# than every five minutes. APW-06 plan §4.9 refuses them with `cron_too_frequent`; APW-10 plan.md:245 carries
# the same rule (`schedule (≥ 5 min)`) with refusal code `CRON_TOO_FREQUENT` (plan.md:268).
#
#   cron-tasker                     * * * * *     → REFUSED
#   cron-calendar-subscriptions     */5 * * * *   → REFUSED (an every-5-minute schedule is "more often than
#                                                   every 5 minutes" only under a strict reading; see
#                                                   ../open-questions.md Q-5)
#   cron-webhook-triggers           * * * * *     → REFUSED
#
# The remaining four (tasker-cleanup, calendar-subscriptions-cleanup, booking-reminder, change-time-zone)
# render unchanged. Whether the whole Deployment is refused or only the offending schedules are dropped is
# not stated by the epic — ../open-questions.md Q-6.
