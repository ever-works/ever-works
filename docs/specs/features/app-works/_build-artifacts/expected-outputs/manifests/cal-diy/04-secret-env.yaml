# GOLDEN RENDERED OUTPUT — cal-diy. Env Secret `app-env-<checksum first 10 hex>` (APW-06 plan §4.1, §4.7).
# Immutable; keys are EXACTLY the App spec's runtime/both-phase env names (APW-06 spec FR-17). An immutable
# Secret means a changed value always produces a new Secret name → a new pod-template env-checksum → a
# restart on the next Deployment, and an unchanged value never does.
#
# 🛑 EVERY VALUE BELOW IS THE LITERAL PLACEHOLDER `<redacted>`. No secret value is written, invented or
# implied anywhere in this file — the assertion surface is the KEY SET, not the values. Each name's real
# source is recorded in _index.md ("Env name → source"), never its value.
#
# Names that reach this Secret come from APW-07's AppRuntimeEnvSource for phases runtime and both. cal-diy
# passes only literal build arguments (`MAX_OLD_SPACE_SIZE`, `CALCOM_TELEMETRY_DISABLED`, `DATABASE_URL`), so
# no `phase: build`-only name is excluded here; `CALCOM_TELEMETRY_DISABLED` is `phase: both` and is therefore
# present in BOTH the build args and this Secret.
#
# ⚠️ The three `APP_*` names at the top are the Blueprint's own bootstrap inputs (`APP_WEB_INTERNAL_URL`,
# `APP_BOOTSTRAP_ADMIN_EMAIL`, `APP_BOOTSTRAP_ADMIN_PASSWORD`). They deliberately do NOT use the
# `EVER_WORKS_` prefix: APW-03's schema reserves that prefix for platform-injected values (R23, error
# `reserved_env_name`, `schema.md:464`) and APW-06 plan §4.7 asserts a collision with the platform ConfigMap
# is "impossible". An earlier draft of this Blueprint used `EVER_WORKS_*` and could not validate; the working
# tree fixed it (`works.yml:120-122`, `:137-151`). See ../contradictions.md **X-1**.
