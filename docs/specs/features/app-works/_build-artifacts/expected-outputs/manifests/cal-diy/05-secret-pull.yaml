# GOLDEN RENDERED OUTPUT — cal-diy. Pull Secret `app-pull` (APW-06 plan §4.1 names table, §4.3, §4.7).
# Mutable on purpose: the read-only GHCR token rotates and the Secret is re-applied, unlike the immutable
# env Secret.
#
# 🛑 NO CREDENTIAL IS WRITTEN HERE. `app-pull` is rendered only when `image.pull` is set — i.e. when APW-05's
# `AppImagePullCredentialSource.resolve(workId, buildId)` returns `{ server, username, password }` rather
# than `null`. The value below is a placeholder token for that payload, not a value of any kind.
# `renderPullSecret` reuses the `buildImagePullSecret` shape (APW-06 T6: "reuse `buildImagePullSecret` shape
# without editing it"), which is `type: kubernetes.io/dockerconfigjson` with `data['.dockerconfigjson']`
# already base64-encoded — `manifest.renderer.ts:263-297`.
#
# This file pins the PRIVATE-image branch: cal-diy built from a fork publishes a GHCR package whose default
# visibility is unverified (APW-05 plan §12 "Known gaps carried forward"), so the golden set renders the
# conservative case. The public-image branch omits this Secret and `spec.template.spec.imagePullSecrets`
# entirely and is exercised by app-fixture-hello.
apiVersion: v1
kind: Secret
metadata:
  name: app-pull
  namespace: ew-cal-diy-11111111
  labels:
    app.kubernetes.io/managed-by: ever-works-k8s-plugin
    app.kubernetes.io/part-of: cal-diy
    ever-works.io/work-id: 11111111-1111-4111-8111-111111111111
    ever-works.io/kind: app
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: "<placeholder: base64(dockerconfigjson with {\"auths\":{\"ghcr.io\":{\"username\":\"x-access-token\",\"password\":\"<redacted>\"}}})>"
