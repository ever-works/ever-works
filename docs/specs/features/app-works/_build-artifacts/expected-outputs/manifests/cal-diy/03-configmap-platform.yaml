# GOLDEN RENDERED OUTPUT — cal-diy. Platform ConfigMap `app-platform-<checksum first 10 hex>`
# (APW-06 plan §4.1 names table, §4.7). Immutable. Holds ONLY the non-secret `EVER_WORKS_*` variables:
#   EVER_WORKS_APP_URL, EVER_WORKS_APP_HOST, EVER_WORKS_APP_COMMIT, EVER_WORKS_DEPLOYMENT_ID
# `EVER_WORKS_SOURCE_URL` (FR-44) is NOT rendered: cal-diy is MIT (works.yml:33-37) and MIT carries no
# `network-source-offer` obligation, so the source-offer condition does not hold.
# The suffix `3b2eee9155` is the first 10 hex of the env checksum — see _index.md "Checksums".
# No value here is a secret; these four are safe to read by anything in the namespace.
#
# ⚠️ The suffix follows the env checksum and therefore changes whenever the App spec's run-phase NAME SET
# changes — including when a platform variable is added (see ../../open-questions.md Q-12 and
# ../contradictions.md X-15). It is a name, not a value.
apiVersion: v1
kind: ConfigMap
metadata:
  name: app-platform-3b2eee9155
  namespace: ew-cal-diy-11111111
  labels:
    app.kubernetes.io/managed-by: ever-works-k8s-plugin
    app.kubernetes.io/part-of: cal-diy
    ever-works.io/work-id: 11111111-1111-4111-8111-111111111111
    ever-works.io/kind: app
immutable: true
data:
  EVER_WORKS_APP_COMMIT: a1b2c3d4e5f60718293a4b5c6d7e8f9012345678
  EVER_WORKS_APP_HOST: cal-diy.apps.example.com
  EVER_WORKS_APP_URL: https://cal-diy.apps.example.com
  EVER_WORKS_DEPLOYMENT_ID: 33333333-3333-4333-8333-333333333333
