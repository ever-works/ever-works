# GOLDEN RENDERED OUTPUT — cal-diy. The declared Kubernetes Jobs (APW-06 plan §4.8, §4.1 names table,
# spec FR-26 rows 2 and 4).
#
# One Job per `spec.jobs[]` entry, named `job-<name>-<deploymentShort>` (≤ 45 chars). The Job uses the
# named COMPONENT's image, env and security context, so a migration runs against exactly the code it
# precedes.
#
#   job-migrate-33333333         when: pre-deploy    → phase 2, BEFORE any component changes.
#                                                     A failure ends the Deployment `failed` with the running
#                                                     app untouched (spec S4, ACC-06-09).
#   job-bootstrap-admin-33333333 when: first-deploy  → phase 4, AFTER the web component is ready and BEFORE
#                                                     the Ingress is published (works.yml:170-172; ACC-06-11).
#                                Rendered only while `isFirstDeploymentOnCluster` is true; the second
#                                Deployment to the same cluster renders no first-deploy Job at all.
#
# Rendered fields (APW-06 plan §4.8): `backoffLimit: <spec.jobs[].retries>` (APW-03 schema default 0),
# `activeDeadlineSeconds: <spec.jobs[].timeoutSeconds>`, `ttlSecondsAfterFinished: 86400`,
# `restartPolicy: Never`. The last 3 Jobs per job name are kept.
#
# `bootstrap-admin` reaches the app through `components.web.internalUrl` (the `APP_WEB_INTERNAL_URL` env
# entry), never through the public address — that is what makes "setup before exposure" possible.
---
apiVersion: batch/v1
kind: Job
metadata:
  name: job-migrate-33333333
  namespace: ew-cal-diy-11111111
  labels:
    app.kubernetes.io/managed-by: ever-works-k8s-plugin
    app.kubernetes.io/part-of: cal-diy
    ever-works.io/work-id: 11111111-1111-4111-8111-111111111111
    ever-works.io/kind: app
    ever-works.io/job: migrate
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 1800
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        ever-works.io/component: web
        app.kubernetes.io/managed-by: ever-works-k8s-plugin
        app.kubernetes.io/part-of: cal-diy
        ever-works.io/work-id: 11111111-1111-4111-8111-111111111111
        ever-works.io/kind: app
        ever-works.io/job: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: app
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: app-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/example-owner/cal.diy/ever-works-app@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          imagePullPolicy: IfNotPresent
          command:
            - npx
            - prisma
            - migrate
            - deploy
            - --schema
            - /calcom/packages/prisma/schema.prisma
          envFrom:
            - secretRef:
                name: app-env-3b2eee9155
                optional: false
            - configMapRef:
                name: app-platform-3b2eee9155
                optional: false
          resources:
            requests:
              cpu: 500m
              memory: 1536Mi
            limits:
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
---
apiVersion: batch/v1
kind: Job
metadata:
  name: job-bootstrap-admin-33333333
  namespace: ew-cal-diy-11111111
  labels:
    app.kubernetes.io/managed-by: ever-works-k8s-plugin
    app.kubernetes.io/part-of: cal-diy
    ever-works.io/work-id: 11111111-1111-4111-8111-111111111111
    ever-works.io/kind: app
    ever-works.io/job: bootstrap-admin
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        ever-works.io/component: web
        app.kubernetes.io/managed-by: ever-works-k8s-plugin
        app.kubernetes.io/part-of: cal-diy
        ever-works.io/work-id: 11111111-1111-4111-8111-111111111111
        ever-works.io/kind: app
        ever-works.io/job: bootstrap-admin
    spec:
      restartPolicy: Never
      serviceAccountName: app
      automountServiceAccountToken: false
      enableServiceLinks: false
      imagePullSecrets:
        - name: app-pull
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/example-owner/cal.diy/ever-works-app@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          imagePullPolicy: IfNotPresent
          command:
            - node
            - --input-type=module
            - -e
            - |
              const res = await fetch(`${process.env.APP_WEB_INTERNAL_URL}/api/auth/setup`, {
                method: 'POST',
                headers: { 'content-type': 'application/json' },
                body: JSON.stringify({
                  username: 'admin',
                  full_name: 'Administrator',
                  email_address: process.env.APP_BOOTSTRAP_ADMIN_EMAIL,
                  password: process.env.APP_BOOTSTRAP_ADMIN_PASSWORD,
                }),
              });
              const text = await res.text();
              if (res.ok) { console.log('bootstrap-admin: created'); process.exit(0); }
              if (res.status === 400 && text.includes('No setup needed')) { console.log('bootstrap-admin: already done'); process.exit(0); }
              console.error(`bootstrap-admin: unexpected HTTP ${res.status}`); // never print the body: it may echo input
              process.exit(1);
          envFrom:
            - secretRef:
                name: app-env-3b2eee9155
                optional: false
            - configMapRef:
                name: app-platform-3b2eee9155
                optional: false
          resources:
            requests:
              cpu: 500m
              memory: 1536Mi
            limits:
              memory: 3Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
