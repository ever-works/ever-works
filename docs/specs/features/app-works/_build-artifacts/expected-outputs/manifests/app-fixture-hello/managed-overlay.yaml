# GOLDEN RENDERED OUTPUT — app-fixture-hello, target "Ever Works Apps" — ONLY the objects that differ.
#
# 🛑 WHO APPLIES THIS. The platform never applies a workload on this target (Resolution R-5;
# APW-10 spec FR-24 at APW-10/spec.md:284-286). APW-06 renders into desired state; the zone's controller
# renders with the same renderer and applies it. The platform's write is a `Work` object `w-<workId>` in the
# control namespace `ever-works-apps-control` (APW-10 plan.md:222-248). `destroyApp` → `removeWork`.
#
# Tenant namespace: `ewa-<first 20 hex of workId>` = `ewa-22222222222222222222` (APW-10 plan.md:254).
# This is not `ew-app-fixture-hello-22222222` — see ../contradictions.md **X-8**.
---
apiVersion: v1
kind: Namespace
metadata:
  name: ewa-22222222222222222222
  labels:
    app.kubernetes.io/managed-by: ever-works-k8s-plugin
    app.kubernetes.io/part-of: app-fixture-hello
    ever-works.io/work-id: 22222222-2222-4222-8222-222222222222
    ever-works.io/kind: app
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
    hosting.ever.works/tenant: "true"
    hosting.ever.works/work-id: 22222222-2222-4222-8222-222222222222
  annotations:
    hosting.ever.works/allowed-hosts: '["app-fixture-hello.apps.example.com"]'
---
apiVersion: v1
kind: LimitRange
metadata:
  name: ew-defaults
  namespace: ewa-22222222222222222222
  labels:
    app.kubernetes.io/managed-by: ever-works-k8s-plugin
    app.kubernetes.io/part-of: app-fixture-hello
    ever-works.io/work-id: 22222222-2222-4222-8222-222222222222
    ever-works.io/kind: app
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: "1"
        memory: 512Mi
        ephemeral-storage: 1Gi
      max:
        cpu: "2"
        memory: 4Gi
---
# The zone's quota profile must admit the fixture's own requests. APW-06 plan §4.2's defaults are shown;
# APW-10 FR-47's Starter profile (1/2 CPU, 2/4 GiB, 10 pods, 4 volumes / 10 GiB) would NOT admit the pod as
# rendered, because the renderer's `max(1, 4 × cpu)` cpu limits are 1 for both components but the profile's
# `limits.cpu: 2` is shared across them — see ../contradictions.md **X-10** and ../open-questions.md Q-7.
apiVersion: v1
kind: ResourceQuota
metadata:
  name: ew-quota
  namespace: ewa-22222222222222222222
  labels:
    app.kubernetes.io/managed-by: ever-works-k8s-plugin
    app.kubernetes.io/part-of: app-fixture-hello
    ever-works.io/work-id: 22222222-2222-4222-8222-222222222222
    ever-works.io/kind: app
spec:
  hard:
    requests.cpu: "2"
    limits.cpu: "4"
    requests.memory: 4Gi
    limits.memory: 6Gi
    pods: "20"
    persistentvolumeclaims: "5"
    requests.storage: 20Gi
    services.loadbalancers: "0"
    services.nodeports: "0"
    count/jobs.batch: "20"
    count/cronjobs.batch: "20"
    secrets: "30"
    configmaps: "30"
---
