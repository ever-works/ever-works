# RENDER-TIME REFUSAL, not an object: `cron-tick` (`*/2 * * * *`) fires more often than every five minutes
# and is refused with `cron_too_frequent` on this target (APW-06 plan §4.9; APW-10 plan.md:245, :268). This
# Work renders NO CronJob on Ever Works Apps.
#
# APPLIED BY THE ZONE ON TOP, not by this renderer (APW-10 plan.md:336-344): runtimeClassName, priorityClassName
# `ever-works-apps-tenant`, hostNetwork/hostPID/hostIPC false, bandwidth annotations, `imagePullSecrets:
# [registry]`, images rewritten to `<zone registry>/t-<id>/<component>@sha256:…`, and re-forced security
# contexts. The zone also applies its own six NetworkPolicies (`default-deny`, `allow-dns`, `allow-edge-ingress`,
# `allow-internet-egress`, `allow-tenant-data`, `quarantine`) — a DIFFERENT name set and a different egress
# except-list from the five this renderer produces (APW-10 plan.md:320-334 vs APW-06 plan §4.10):
# ../contradictions.md **X-11**.
