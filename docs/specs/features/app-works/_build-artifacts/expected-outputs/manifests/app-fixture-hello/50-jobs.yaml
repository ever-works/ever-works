# Both use the `web` component's image, env and security context. `timeoutSeconds: 120` → exactly 120 s of
# `activeDeadlineSeconds`; `retries` defaults to 0 (APW-03 schema.md:318 → `backoffLimit: 0`), which is what
# makes a broken migration fail the Deployment on the first attempt rather than silently retrying.
