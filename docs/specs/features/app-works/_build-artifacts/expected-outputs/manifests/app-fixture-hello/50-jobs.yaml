    app.kubernetes.io/part-of: app-fixture-hello
    ever-works.io/work-id: 22222222-2222-4222-8222-222222222222
    ever-works.io/kind: app
    ever-works.io/job: migrate
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 120
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        ever-works.io/component: web
        app.kubernetes.io/managed-by: ever-works-k8s-plugin
        app.kubernetes.io/part-of: app-fixture-hello
        ever-works.io/work-id: 22222222-2222-4222-8222-222222222222
        ever-works.io/kind: app
        ever-works.io/job: migrate
    spec:
      restartPolicy: Never
      serviceAccountName: app
      automountServiceAccountToken: false
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/example-owner/app-fixture-hello/ever-works-app@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
          imagePullPolicy: IfNotPresent
          command:
            - node
            - src/migrate.mjs
          envFrom:
            - secretRef:
                name: app-env-fa90df132e
                optional: false
            - configMapRef:
                name: app-platform-fa90df132e
                optional: false
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir:
            sizeLimit: 256Mi
