apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: web
    namespace: ew-cal-diy-11111111
    labels:
        app.kubernetes.io/managed-by: ever-works-k8s-plugin
        app.kubernetes.io/part-of: cal-diy
        ever-works.io/work-id: 11111111-1111-4111-8111-111111111111
        ever-works.io/kind: app
        ever-works.io/component: web
    annotations:
        cert-manager.io/cluster-issuer: letsencrypt
spec:
    ingressClassName: nginx
    tls:
        - hosts:
              - cal-diy.ever.works
          secretName: cal-diy-ever-works-tls
    rules:
        - host: cal-diy.ever.works
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: web
                            port:
                                number: 80
