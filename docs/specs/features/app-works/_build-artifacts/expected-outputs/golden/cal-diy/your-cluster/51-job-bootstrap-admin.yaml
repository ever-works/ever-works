# NO SECRET VALUE APPEARS IN THIS FILE — every secret is a reference or a generated placeholder.
apiVersion: batch/v1
kind: Job
metadata:
    name: job-bootstrap-admin-88888888
    namespace: ew-cal-diy-11111111
    labels:
        app.kubernetes.io/managed-by: ever-works-k8s-plugin
        app.kubernetes.io/part-of: cal-diy
        ever-works.io/work-id: 11111111-1111-4111-8111-111111111111
        ever-works.io/kind: app
        ever-works.io/job: bootstrap-admin
        ever-works.io/component: web
spec:
    backoffLimit: 0
    activeDeadlineSeconds: 300
    ttlSecondsAfterFinished: 86400
    template:
        metadata:
            labels:
                ever-works.io/job: bootstrap-admin
                ever-works.io/component: web
                app.kubernetes.io/managed-by: ever-works-k8s-plugin
                app.kubernetes.io/part-of: cal-diy
                ever-works.io/work-id: 11111111-1111-4111-8111-111111111111
                ever-works.io/kind: app
        spec:
            restartPolicy: Never
            serviceAccountName: app
            automountServiceAccountToken: false
            enableServiceLinks: false
            securityContext:
                runAsNonRoot: true
                seccompProfile:
                    type: RuntimeDefault
            imagePullSecrets:
                - name: app-pull
            containers:
                - name: bootstrap-admin
                  image: ghcr.io/example-owner/cal.diy/ever-works-app@sha256:0f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f0
                  imagePullPolicy: IfNotPresent
                  command:
                      - node
                      - '--input-type=module'
                      - '-e'
                      - |
                          const res = await fetch(`${process.env.APP_WEB_INTERNAL_URL}/api/auth/setup`, {
                            method: 'POST',
                            headers: { 'content-type': 'application/json' },
                            body: JSON.stringify({
                              username: 'admin',
                              full_name: 'Administrator',
                              email_address: process.env.APP_BOOTSTRAP_ADMIN_EMAIL,
                              password: process.env.APP_BOOTSTRAP_ADMIN_PASSWORD,
                            }),
                          });
                          const text = await res.text();
                          if (res.ok) { console.log('bootstrap-admin: created'); process.exit(0); }
                          if (res.status === 400 && text.includes('No setup needed')) { console.log('bootstrap-admin: already done'); process.exit(0); }
                          console.error(`bootstrap-admin: unexpected HTTP ${res.status}`); // never print the body: it may echo input
                          process.exit(1);
                  envFrom:
                      - secretRef:
                            name: app-env-b1eff0d86e
                            optional: false
                      - configMapRef:
                            name: app-platform-b1eff0d86e
                            optional: false
                  resources:
                      requests:
                          cpu: 500m
                          memory: 1536Mi
                      limits:
                          memory: 3Gi
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: false
                      capabilities:
                          drop:
                              - ALL
