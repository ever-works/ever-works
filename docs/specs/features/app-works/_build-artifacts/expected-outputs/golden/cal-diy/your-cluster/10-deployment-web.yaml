                          cpu: 500m
                          memory: 1536Mi
                      limits:
                          memory: 3Gi
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: false
                      capabilities:
                          drop:
                              - ALL
            volumes:
                - name: tmp
                  emptyDir:
                      sizeLimit: 256Mi
