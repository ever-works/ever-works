apiVersion: apps/v1
kind: Deployment
metadata:
    name: web
    namespace: ew-cal-diy-11111111
    labels:
        app.kubernetes.io/managed-by: ever-works-k8s-plugin
        app.kubernetes.io/part-of: cal-diy
        ever-works.io/work-id: 11111111-1111-4111-8111-111111111111
        ever-works.io/kind: app
        ever-works.io/component: web
spec:
    replicas: 1
    revisionHistoryLimit: 5
    progressDeadlineSeconds: 750
    minReadySeconds: 0
    strategy:
        type: RollingUpdate
        rollingUpdate:
            maxSurge: 0
            maxUnavailable: 1
    selector:
        matchLabels:
            ever-works.io/component: web
    template:
        metadata:
            labels:
                ever-works.io/component: web
                app.kubernetes.io/managed-by: ever-works-k8s-plugin
                app.kubernetes.io/part-of: cal-diy
                ever-works.io/work-id: 11111111-1111-4111-8111-111111111111
                ever-works.io/kind: app
            annotations:
                ever-works.io/env-checksum: b1eff0d86ec7b74a
                ever-works.io/build-commit: a1b2c3d4e5f60718293a4b5c6d7e8f9012345678
                ever-works.io/deployment-id: 88888888-8888-4888-8888-888888888888
        spec:
            serviceAccountName: app
            automountServiceAccountToken: false
            enableServiceLinks: false
            securityContext:
                runAsNonRoot: true
                seccompProfile:
                    type: RuntimeDefault
            imagePullSecrets:
                - name: app-pull
            topologySpreadConstraints:
                - maxSkew: 1
                  topologyKey: kubernetes.io/hostname
                  whenUnsatisfiable: ScheduleAnyway
                  labelSelector:
                      matchLabels:
                          ever-works.io/component: web
            containers:
                - name: web
                  image: ghcr.io/example-owner/cal.diy/ever-works-app@sha256:0f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f0
                  imagePullPolicy: IfNotPresent
                  command:
                      - /calcom/scripts/start.sh
                  ports:
                      - name: http
                        containerPort: 3000
                        protocol: TCP
                  envFrom:
                      - secretRef:
                            name: app-env-b1eff0d86e
                            optional: false
                      - configMapRef:
                            name: app-platform-b1eff0d86e
                            optional: false
                  startupProbe:
                      httpGet:
                          path: /api/version
                          port: http
                      initialDelaySeconds: 0
                      timeoutSeconds: 5
                      periodSeconds: 10
                      failureThreshold: 60
                  readinessProbe:
                      httpGet:
                          path: /auth/login
                          port: http
                      initialDelaySeconds: 0
                      timeoutSeconds: 5
                      periodSeconds: 10
                      failureThreshold: 3
                  livenessProbe:
                      httpGet:
                          path: /api/version
                          port: http
                      initialDelaySeconds: 0
                      timeoutSeconds: 5
                      periodSeconds: 30
                      failureThreshold: 3
                  resources:
