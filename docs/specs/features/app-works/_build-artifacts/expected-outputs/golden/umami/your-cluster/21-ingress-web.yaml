apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: web
    namespace: ew-umami-33333333
    labels:
        app.kubernetes.io/managed-by: ever-works-k8s-plugin
        app.kubernetes.io/part-of: umami
        ever-works.io/work-id: 33333333-3333-4333-8333-333333333333
        ever-works.io/kind: app
        ever-works.io/component: web
    annotations:
        cert-manager.io/cluster-issuer: letsencrypt
spec:
    ingressClassName: nginx
    tls:
        - hosts:
              - umami.ever.works
          secretName: umami-ever-works-tls
    rules:
        - host: umami.ever.works
          http:
              paths:
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: web
                            port:
                                number: 80
