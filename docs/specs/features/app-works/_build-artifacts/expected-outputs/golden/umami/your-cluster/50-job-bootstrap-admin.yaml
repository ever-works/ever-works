# NO SECRET VALUE APPEARS IN THIS FILE — every secret is a reference or a generated placeholder.
apiVersion: batch/v1
kind: Job
metadata:
    name: job-bootstrap-admin-99999999
    namespace: ew-umami-33333333
    labels:
        app.kubernetes.io/managed-by: ever-works-k8s-plugin
        app.kubernetes.io/part-of: umami
        ever-works.io/work-id: 33333333-3333-4333-8333-333333333333
        ever-works.io/kind: app
        ever-works.io/job: bootstrap-admin
        ever-works.io/component: web
spec:
    backoffLimit: 0
    activeDeadlineSeconds: 180
    ttlSecondsAfterFinished: 86400
    template:
        metadata:
            labels:
                ever-works.io/job: bootstrap-admin
                ever-works.io/component: web
                app.kubernetes.io/managed-by: ever-works-k8s-plugin
                app.kubernetes.io/part-of: umami
                ever-works.io/work-id: 33333333-3333-4333-8333-333333333333
                ever-works.io/kind: app
        spec:
            restartPolicy: Never
            serviceAccountName: app
            automountServiceAccountToken: false
            enableServiceLinks: false
            securityContext:
                runAsNonRoot: true
                seccompProfile:
                    type: RuntimeDefault
            imagePullSecrets:
                - name: app-pull
            containers:
                - name: bootstrap-admin
                  image: ghcr.io/umami-software/umami@sha256:85909afc45bdcda1917394594a087421fdbb05610fded0fa9f6fb861abb2f367
                  imagePullPolicy: IfNotPresent
                  command:
                      - node
                      - '--input-type=module'
                      - '-e'
                      - |
                          const base = process.env.APP_WEB_INTERNAL_URL;
                          const login = await fetch(`${base}/api/auth/login`, {
                            method: 'POST',
                            headers: { 'content-type': 'application/json' },
                            body: JSON.stringify({ username: 'admin', password: 'umami' }),
                          });
                          if (login.status === 401) { console.log('bootstrap-admin: default password already replaced'); process.exit(0); }
                          if (!login.ok) { console.error(`bootstrap-admin: login HTTP ${login.status}`); process.exit(1); }
                          const { token } = await login.json();
                          const change = await fetch(`${base}/api/me/password`, {
                            method: 'POST',
                            headers: { 'content-type': 'application/json', authorization: `Bearer ${token}` },
                            body: JSON.stringify({ currentPassword: 'umami', newPassword: process.env.APP_BOOTSTRAP_ADMIN_PASSWORD }),
                          });
                          if (!change.ok) { console.error(`bootstrap-admin: password change HTTP ${change.status}`); process.exit(1); }
                          console.log('bootstrap-admin: default password replaced');
                  envFrom:
                      - secretRef:
                            name: app-env-3289ab9d92
                            optional: false
                      - configMapRef:
                            name: app-platform-3289ab9d92
                            optional: false
                  resources:
                      requests:
                          cpu: 250m
                          memory: 512Mi
                      limits:
                          memory: 1Gi
                  securityContext:
                      allowPrivilegeEscalation: false
                      readOnlyRootFilesystem: false
                      capabilities:
                          drop:
                              - ALL
