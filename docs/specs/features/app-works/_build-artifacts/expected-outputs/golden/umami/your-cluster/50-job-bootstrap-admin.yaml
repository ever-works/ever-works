# Renderer  : packages/plugins/k8s/src/app/ — APW-06 app-manifest.renderer.ts (T6), app-names.ts (T4),
#             app-security.ts (T5), app-jobs.renderer.ts / app-runner.script.ts (T8),
#             app-network-policy.renderer.ts (T7)
# Spec      : APW-06 plan.md §4.8 (`command` jobs: the component’s image, env, security context and
# Spec      : resources; `backoffLimit: retries`, `activeDeadlineSeconds: timeoutSeconds`,
# Spec      : `ttlSecondsAfterFinished: 86400`, `restartPolicy: Never`; the last 3 Jobs per name are kept)
# Spec      : APW-06 spec.md FR-26 row 2 (pre-deploy jobs in declared order) and row 4 (first-deploy jobs
# Spec      : run before the app is published), FR-51 (Run now reuses this definition)
