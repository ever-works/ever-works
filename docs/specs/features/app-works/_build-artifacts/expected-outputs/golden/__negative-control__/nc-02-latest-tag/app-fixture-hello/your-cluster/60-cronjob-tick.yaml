apiVersion: batch/v1
kind: CronJob
metadata:
    name: cron-tick
    namespace: ew-app-fixture-hello-22222222
    labels:
        app.kubernetes.io/managed-by: ever-works-k8s-plugin
        app.kubernetes.io/part-of: app-fixture-hello
        ever-works.io/work-id: 22222222-2222-4222-8222-222222222222
        ever-works.io/kind: app
        ever-works.io/cron: tick
spec:
    schedule: '*/2 * * * *'
    timeZone: Etc/UTC
    concurrencyPolicy: Forbid
    startingDeadlineSeconds: 300
    successfulJobsHistoryLimit: 1
    failedJobsHistoryLimit: 3
    suspend: false
    jobTemplate:
        spec:
            backoffLimit: 0
            activeDeadlineSeconds: 630
            ttlSecondsAfterFinished: 86400
            template:
                metadata:
                    labels:
                        ever-works.io/cron: tick
                        app.kubernetes.io/managed-by: ever-works-k8s-plugin
                        app.kubernetes.io/part-of: app-fixture-hello
                        ever-works.io/work-id: 22222222-2222-4222-8222-222222222222
                        ever-works.io/kind: app
                spec:
                    restartPolicy: Never
                    serviceAccountName: app
                    automountServiceAccountToken: false
                    enableServiceLinks: false
                    securityContext:
                        runAsNonRoot: true
                        seccompProfile:
                            type: RuntimeDefault
                    containers:
                        - name: runner
                          image: <APP_RUNNER_IMAGE — packages/plugins/k8s/src/app/app-runner.image.ts>
                          imagePullPolicy: IfNotPresent
                          command:
                              - node
                              - /ew/app-runner.script.mjs
                          env:
                              - name: EW_REQUESTS
                                value: /ew/requests.json
                          resources:
                              requests:
                                  cpu: 50m
                                  memory: 64Mi
                              limits:
                                  cpu: 500m
                                  memory: 128Mi
                          securityContext:
                              runAsNonRoot: true
                              runAsUser: 10001
                              runAsGroup: 10001
                              allowPrivilegeEscalation: false
                              readOnlyRootFilesystem: true
                              capabilities:
                                  drop:
                                      - ALL
                          volumeMounts:
                              - name: runner
                                mountPath: /ew
                                readOnly: true
                              - name: tmp
                                mountPath: /tmp
                    volumes:
                        - name: runner
                          configMap:
                              name: ew-runner-918eaf204a
                              defaultMode: 292
                        - name: tmp
                          emptyDir:
                              sizeLimit: 256Mi
