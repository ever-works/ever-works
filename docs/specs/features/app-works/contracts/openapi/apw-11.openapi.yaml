# App Works — APW-11 OpenAPI fragment (App Launcher and apps registry)
#
# Skeleton, not a source of truth. The generated `apps/api/openapi.json` is authoritative;
# this fragment is the reviewable expectation that the generated document is a SUPERSET of it.
# See ./README.md for the convention, the superset rule and the checker
# (`apps/api/src/openapi/__tests__/app-works-contract.spec.ts`), which holds this fragment
# to zero findings.
#
# The three routes of APW-11 plan section 4: the registry read (a session, or a delegated
# Ever ID token carrying `apps:read` sent from an allowed browser origin), the arrangement
# save (session only) and the public platform list. The shapes are the contract types of
# `packages/contracts/src/apps/app-launcher.ts` (plan section 3.3), which the API describes
# through `apps/api/src/app-launcher/dto/app-launcher-response.dto.ts`.
openapi: 3.0.3

info:
    title: Ever Works API — App Works fragment (APW-11)
    description: >-
        Routes owned by APW-11 (App Launcher and apps registry). P1 serves the launcher inside
        Ever Works; P2 lets a page of another Ever app read the same list for the signed-in
        person with a delegated, read-only token. The launcher contract is additive: a closed
        union may gain a member and an object may gain a property, never lose one, so a client
        ignores properties it does not know and treats an unknown union member as the closest
        known one (an unknown platform `status` as not openable).
    version: fragment

paths:
    /api/me/apps:
        get:
            operationId: listMyApps
            summary: List the App Launcher items for the signed-in person
            description: >-
                The merged, ordered list of pinned items, Ever apps and the person's own Works,
                with each tile's address, chip, visibility and Manage apps state resolved by the
                server. `includeHidden=true` is the Manage apps view. The caller is a session, or
                another Ever app acting for the person with a delegated Ever ID access token:
                audience `ever-works`, scope `apps:read`, lifetime at most 3,600 s, minted for a
                trusted client when the installation lists trusted clients
                (`EVER_ID_TRUSTED_CLIENT_IDS`), sent as `Authorization: Bearer` from a browser
                page whose origin is in `EVER_WORKS_APP_LAUNCHER_ORIGINS`. A delegated call
                carries no cookies and never puts the token in the URL; it reads exactly what
                the session read returns for the same person and can never write. A delegated
                call with no `Origin` header, or one not on the list, is refused before the token
                is read.
            tags: [App Launcher]
            security:
                - JWT-auth: []
            x-source: >-
                docs/specs/features/app-works/APW-11-app-launcher/plan.md sections 3.3, 4.1, 4.5
                and 4.7; spec.md FR-33, FR-34, FR-49, FR-50, FR-63; APW-12-ever-id/spec.md FR-44
                to FR-47
            x-mcp: >-
                not-exposed (no MCP tool exists for this route today; agent-surfaces.md section 3.2
                plans a read-only one, and the change that adds it names the tool here)
            x-throttle: 60 requests / 60 s per person
            x-delegated-read:
                scope: apps:read
                audience: ever-works
                maxTokenLifetimeSeconds: 3600
                allowedOrigins: EVER_WORKS_APP_LAUNCHER_ORIGINS
                trustedClients: EVER_ID_TRUSTED_CLIENT_IDS
                credentials: none
            parameters:
                - name: includeHidden
                  in: query
                  required: false
                  description: '`true` is the Manage apps view: hidden and not-live items too.'
                  schema:
                      type: string
                      enum: ['true', 'false']
                      default: 'false'
                - name: limit
                  in: query
                  required: false
                  schema:
                      type: integer
                      minimum: 1
                      maximum: 200
                      default: 200
                - name: q
                  in: query
                  required: false
                  description: >-
                      Filters items by name, case- and accent-insensitively, before `limit`
                      applies; trimmed.
                  schema:
                      type: string
                      maxLength: 100
            responses:
                '200':
                    description: The ordered list plus its `meta` facts.
                    headers:
                        Access-Control-Allow-Origin:
                            description: >-
                                On a cross-origin call from an allowed origin, that origin.
                                `Access-Control-Allow-Credentials` is never sent and no response
                                to a delegated call sets a cookie.
                            schema:
                                type: string
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AppLauncherListResponse'
                '400':
                    description: >-
                        `limit` outside 1..200, `q` longer than 100 characters, an unknown query
                        parameter, or a token in the query string (`token_in_query`).
                '401':
                    description: No session, or a delegated token that does not verify.
                '403':
                    description: >-
                        A delegated call refused: `insufficient_scope` (the token does not carry
                        `apps:read`) or `origin_not_allowed` (no `Origin` header, or one not on the
                        installation's list). A host shows the signed-out state.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DelegatedReadRefusal'
                '404':
                    description: The App Launcher is switched off on this installation.
                '429':
                    description: More than 60 reads per minute.

    /api/me/apps/preferences:
        put:
            operationId: saveMyAppsPreferences
            summary: Save the signed-in person's App Launcher arrangement
            description: >-
                A merge patch per item: show or hide, pin or unpin, and the order of a section
                being reordered. Pinning past six items refuses the whole save with `422` and
                writes nothing; an unknown or inaccessible key is answered per item with
                `unknownItem`. Session only: a delegated token is answered like any invalid
                credential (`401`), so a delegated caller can never change an arrangement.
            tags: [App Launcher]
            security:
                - JWT-auth: []
            x-source: >-
                docs/specs/features/app-works/APW-11-app-launcher/plan.md sections 3.3, 4.2 and
                4.5; spec.md FR-25, FR-28, FR-29, FR-35, FR-49, FR-62
            x-mcp: >-
                not-exposed (no MCP tool exists for this route today; agent-surfaces.md section 3.2
                plans one, and the change that adds it names the tool here)
            x-throttle: 30 requests / 60 s per person
            requestBody:
                required: true
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/SaveAppLauncherPreferencesRequest'
            responses:
                '200':
                    description: What was saved, what was refused, and the refreshed Manage apps list.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AppLauncherSavePreferencesResponse'
                '400':
                    description: A bad key shape, an order out of range, or not 1..200 changes.
                '401':
                    description: No session; a delegated token included.
                '404':
                    description: The App Launcher is switched off on this installation.
                '422':
                    description: The save would pin more than six items; nothing was saved.
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AppLauncherPinLimitError'
                '429':
                    description: More than 30 saves per minute.

    /api/app-launcher/platforms:
        get:
            operationId: listAppLauncherPlatforms
            summary: List the Ever apps of one environment (public)
            description: >-
                The runtime platform catalog for one environment: public data, readable signed
                out from any origin without credentials, cacheable for an hour.
            tags: [App Launcher]
            security: []
            x-source: >-
                docs/specs/features/app-works/APW-11-app-launcher/plan.md sections 3.3 and 4.3;
                spec.md FR-9, FR-10, FR-37
            x-mcp: >-
                not-exposed (no MCP tool exists for this route today; agent-surfaces.md section 3.2
                lists it as public, cached data)
            x-throttle: 120 requests / 60 s per caller
            parameters:
                - name: environment
                  in: query
                  required: false
                  description: >-
                      Whose addresses to return. An unrecognised value is ignored and the
                      installation's own environment applies.
                  schema:
                      type: string
                      enum: [production, stage, develop]
            responses:
                '200':
                    description: The catalog version, its environment and the Ever apps tiles.
                    headers:
                        Cache-Control:
                            description: Cacheable for an hour, with a ten-minute stale window.
                            schema:
                                type: string
                                example: public, max-age=3600, stale-while-revalidate=600
                        Access-Control-Allow-Origin:
                            description: Any origin; no credentials are ever accepted.
                            schema:
                                type: string
                                example: '*'
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/AppLauncherPlatformsResponse'
                '404':
                    description: The App Launcher is switched off on this installation.
                '429':
                    description: More than 120 reads per minute.

components:
    securitySchemes:
        JWT-auth:
            type: http
            scheme: bearer
            bearerFormat: JWT
            description: >-
                An Ever Works session bearer, or on `GET /api/me/apps` only, a delegated Ever ID
                access token (see that operation).

    schemas:
        AppLauncherItem:
            type: object
            description: One launcher tile. Every derived fact travels with the tile.
            x-source: packages/contracts/src/apps/app-launcher.ts (AppLauncherItem); plan.md section 3.3
            required:
                - key
                - kind
                - section
                - name
                - url
                - host
                - visible
                - pinned
                - pinOrder
                - order
                - manageState
            properties:
                key:
                    type: string
                    description: '`platform:<catalogId>` or `work:<uuid>`.'
                    example: platform:ever-works
                kind:
                    type: string
                    enum: [platform, work]
                section:
                    type: string
                    enum: [pinned, platforms, works]
                    description: The section the tile renders under; `pinned` wins over the kind.
                name:
                    type: string
                    maxLength: 100
                description:
                    type: string
                    maxLength: 80
                    description: Ever apps only.
                iconDataUri:
                    type: string
                    description: >-
                        An inline `data:image/svg+xml;base64,…` or `data:image/png;base64,…` icon of
                        at most 16 KB, rendered as an image and never as markup.
                url:
                    type: string
                    nullable: true
                    description: An `https` address; `null` exactly when `manageState` is not `listed`.
                host:
                    type: string
                    nullable: true
                    description: The host of `url`.
                current:
                    type: boolean
                    description: The tile of the app the launcher is shown in; it is not a link.
                status:
                    type: string
                    enum: [available, beta, soon]
                    description: Ever apps only. A `soon` tile is shown and cannot be opened.
                workKind:
                    type: string
                    description: "Works only: the Work's kind."
                chip:
                    type: string
                    enum: [deploying, lastDeployFailed]
                    description: Works only.
                visible:
                    type: boolean
                pinned:
                    type: boolean
                pinOrder:
                    type: integer
                    nullable: true
                    description: Position in the pinned section, or `null` when not pinned.
                order:
                    type: integer
                    description: Position inside its section.
                manageState:
                    type: string
                    enum: [listed, notLive, exposureOff]

        AppLauncherListResponse:
            type: object
            x-source: packages/contracts/src/apps/app-launcher.ts (AppLauncherListResponse); plan.md section 3.3
            required: [items, meta]
            properties:
                items:
                    type: array
                    maxItems: 200
                    items:
                        $ref: '#/components/schemas/AppLauncherItem'
                meta:
                    type: object
                    required:
                        - environment
                        - catalogVersion
                        - catalogAvailable
                        - scopeKey
                        - worksTotal
                        - total
                        - truncated
                        - pinLimit
                        - appWorksAvailable
                    properties:
                        environment:
                            type: string
                            enum: [production, stage, develop]
                        catalogVersion:
                            type: string
                            nullable: true
                            description: The catalog version read, or `null` when no catalog is available.
                        catalogAvailable:
                            type: boolean
                            description: False when the catalog could not be read and only the current app is listed.
                        scopeKey:
                            type: string
                            description: '`global`, `personal`, or the active Organization id.'
                        worksTotal:
                            type: integer
                            description: How many Works this scope holds.
                        total:
                            type: integer
                            description: >-
                                How many items are eligible in this scope, counted before `limit`
                                and before the `q` filter.
                        truncated:
                            type: boolean
                            description: True when the answer was cut at `limit`.
                        pinLimit:
                            type: integer
                            enum: [6]
                        appWorksAvailable:
                            type: boolean
                            description: Whether App Works are available to this person.

        AppLauncherPreferenceChange:
            type: object
            additionalProperties: false
            description: >-
                A merge patch for one item: an absent field keeps its stored value. There is no
                `pinOrder`: pinning appends after the last pin.
            x-source: packages/contracts/src/apps/app-launcher.ts (AppLauncherPreferenceChange); plan.md section 4.2
            required: [key]
            properties:
                key:
                    type: string
                    pattern: '^(platform:[a-z0-9-]{2,40}|work:[0-9a-f-]{36})$'
                visible:
                    type: boolean
                pinned:
                    type: boolean
                order:
                    type: integer
                    minimum: 0
                    maximum: 9999

        SaveAppLauncherPreferencesRequest:
            type: object
            additionalProperties: false
            x-source: apps/api/src/app-launcher/app-launcher.controller.ts (SaveAppLauncherPreferencesDto); plan.md section 4.2
            required: [changes]
            properties:
                changes:
                    type: array
                    minItems: 1
                    maxItems: 200
                    items:
                        $ref: '#/components/schemas/AppLauncherPreferenceChange'

        AppLauncherRejection:
            type: object
            x-source: packages/contracts/src/apps/app-launcher.ts (AppLauncherRejection)
            required: [key, reason]
            properties:
                key:
                    type: string
                reason:
                    type: string
                    enum: [unknownItem, cannotHideCurrent]
                    description: >-
                        `unknownItem` is identical for an item that does not exist and one that is
                        not the caller's.

        AppLauncherSavePreferencesResponse:
            type: object
            x-source: packages/contracts/src/apps/app-launcher.ts (AppLauncherSavePreferencesResponse)
            required: [saved, rejected, items]
            properties:
                saved:
                    type: integer
                rejected:
                    type: array
                    items:
                        $ref: '#/components/schemas/AppLauncherRejection'
                items:
                    type: array
                    description: The refreshed `includeHidden=true` list.
                    items:
                        $ref: '#/components/schemas/AppLauncherItem'

        AppLauncherPinLimitError:
            type: object
            x-source: packages/contracts/src/apps/app-launcher.ts (AppLauncherPinLimitErrorBody); plan.md section 4.5
            required: [code, limit]
            properties:
                code:
                    type: string
                    enum: [pinLimit]
                limit:
                    type: integer
                    enum: [6]

        AppLauncherPlatformsResponse:
            type: object
            x-source: packages/contracts/src/apps/app-launcher.ts (AppLauncherPlatformsResponse); plan.md section 4.3
            required: [catalogVersion, environment, platforms]
            properties:
                catalogVersion:
                    type: string
                    nullable: true
                environment:
                    type: string
                    enum: [production, stage, develop]
                platforms:
                    type: array
                    maxItems: 24
                    items:
                        $ref: '#/components/schemas/AppLauncherItem'

        DelegatedReadRefusal:
            type: object
            description: >-
                The platform error body. On the wire the code is snake_case (CONTRACTS section 12);
                its camelCase form (`insufficientScope`, `originNotAllowed`) is only an i18n leaf.
            x-source: >-
                packages/contracts/src/apps/app-launcher.ts (APP_LAUNCHER_ORIGIN_NOT_ALLOWED);
                packages/contracts/src/apps/ever-id.ts (insufficient_scope); spec.md FR-50, ACC-11-38
            required: [status, code, message]
            properties:
                status:
                    type: string
                    enum: [error]
                code:
                    type: string
                    enum: [insufficient_scope, origin_not_allowed]
                message:
                    type: string
