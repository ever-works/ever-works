# yaml-language-server: $schema=https://api.ever.works/api/schema/works.yml.schema.json
#
# DRAFT App Blueprint — seed content of the Blueprint repository `ever-works/umami-template` (APW-13).
# Shape: docs/specs/features/app-works/CONTRACTS.md §1 (including the APW-13 additions).
#
# Purpose: the FAST real-world validation of the runtime path. It uses the upstream's published image, so a run
# spends no build minutes. Facts were read on 2026-09-17 from umami-software/umami at release v3.4.0
# (commit ec0ff50388c264ed8ce46f00967e92f7e71476ae) and from the GitHub Packages listing of its image; sources
# are cited in ../README.md. "Verified" means read in source or registry metadata, not yet run.
#
# Consequence of the image strategy: a change an agent merges into the fork is NOT rebuilt. Switching
# `build.strategy` to `dockerfile` (the upstream ships a Dockerfile) is a one-line pull request — see README.

version: 2
kind: app
name: Umami

spec:
  source:
    relation: fork
    upstream: { repo: umami-software/umami, defaultBranch: master } # verified: default branch is `master`
    branch: master

  blueprint:
    id: umami
    version: 0.1.0
    repo: ever-works/umami-template
    sha: '0000000000000000000000000000000000000000' # TODO(release): stamped by the Blueprint release workflow

  license:
    spdx: MIT # verified: repository licence metadata
    class: green
    source: blueprint

  display:
    name: Umami
    protectedPaths: [LICENSE]

  build:
    strategy: image
    # verified: tag 3.4.0 (also `3.4`, `3`, `latest`, `postgresql-latest`) points at this index digest,
    # published 2026-09-17. Pin by digest; a tag can move.
    image: ghcr.io/umami-software/umami@sha256:85909afc45bdcda1917394594a087421fdbb05610fded0fa9f6fb861abb2f367

  components:
    - name: web
      role: web
      # No command: the image CMD runs the database check (which migrates) and then the server. That script
      # stops on the first error, so a failed migration fails the container — no separate migrate job needed.
      port: 3000 # verified: EXPOSE 3000, PORT=3000
      # verified: the image's user is the NAME `nextjs` (`adduser --system --uid 1001 nextjs`, Dockerfile L59-L61,
      # then `USER nextjs`, L97) — a name, not the numeric uid. kubelet refuses a non-numeric image user under
      # `runAsNonRoot` unless `runAsUser` is set ("container has runAsNonRoot and image has non-numeric user (%s),
      # cannot verify user is non-root", kubernetes/pkg/kubelet/kuberuntime/security_context_others.go), and
      # APW-06 plan §4.4 renders `runAsNonRoot: true` with no `runAsUser` (targetSettings `allowRoot: false`).
      # TODO(contract, APW-03): an optional numeric `components[].runAsUser` (schema.md §10 has no user field
      # today) is what this Blueprint needs; it will then declare `runAsUser: 1001` for the `web` component.
      replicas: 1
      # verified: `scripts/start-docker.sh` runs `check-db.js`, `update-tracker.js` and then `node server.js`, and
      # `scripts/update-tracker.js` writes `public/script.js` ONLY when `COLLECT_API_ENDPOINT` is set — which this
      # Blueprint does not set. So a read-only root filesystem may hold: `false` is what the verification lane
      # should try (the Prisma CLI's writes and the server's cache writes are the unverified part).
      writableRootFilesystem: true
      probes:
        startup: { http: /api/heartbeat, periodSeconds: 5, failureThreshold: 60 } # verified: returns {"ok":true}
        readiness: { http: /login } # verified: page route exists
        liveness: { http: /api/heartbeat, periodSeconds: 30 }
      resources: { cpu: 250m, memory: 512Mi, memoryLimit: 1Gi } # TODO(verify): measure

  dependencies:
    # The upstream compose file uses Postgres 15. Upstream documents "A PostgreSQL database version v12.14+"
    # (README L31) and `scripts/check-db.js` L8-L9 / L63-L66 refuses to start below `9.4.0`. The Blueprint asks
    # for 16; the two are compatible, 16 being far above both floors.
    postgres: { version: '16', directUrl: true } # verified: migrations prefer DIRECT_DATABASE_URL when set

  env:
    - { name: DATABASE_URL, secret: true, from: deps.postgres.url }
    - { name: DIRECT_DATABASE_URL, secret: true, from: deps.postgres.directUrl }
    - name: APP_SECRET # verified: the compose file asks for a random string
      secret: true
      generate: { kind: hex, bytes: 32, rotate: never }
    - name: TWO_FACTOR_ENCRYPTION_KEY # verified: the compose file asks for a 64-character hex string
      secret: true
      generate: { kind: hex, bytes: 32, rotate: never }
      validate: { length: 64, pattern: '^[0-9a-f]{64}$' }
    - { name: DISABLE_TELEMETRY, value: '1' } # verified: read by the telemetry script route and the config route
    - { name: DISABLE_UPDATES, value: '1' } # verified: read by the config route (no update checks)
    # NOT named EVER_WORKS_*: that prefix is reserved for platform-injected values (CONTRACTS §1 / schema.md
    # rule R23 → `reserved_env_name`). These are the Blueprint's own bootstrap inputs, read by the job below.
    - { name: APP_WEB_INTERNAL_URL, from: components.web.internalUrl } # used only by bootstrap-admin
    - name: APP_BOOTSTRAP_ADMIN_PASSWORD
      secret: true
      prompt: { description: 'New password for the `admin` user (at least 12 characters)', required: true }
      validate: { pattern: '^.{12,}$' }

  jobs:
    # The upstream creates a first user with a documented default password. The Blueprint replaces it before
    # the app is reachable (first-deploy jobs run before the ingress is published). Idempotent: when the default
    # password is no longer accepted, the job treats the replacement as already done.
    - name: bootstrap-admin
      when: first-deploy
      component: web
      timeoutSeconds: 180
      command:
        - node
        - --input-type=module
        - -e
        - |
          const base = process.env.APP_WEB_INTERNAL_URL;
          const login = await fetch(`${base}/api/auth/login`, {
            method: 'POST',
            headers: { 'content-type': 'application/json' },
            body: JSON.stringify({ username: 'admin', password: 'umami' }),
          });
          if (login.status === 401) { console.log('bootstrap-admin: default password already replaced'); process.exit(0); }
          if (!login.ok) { console.error(`bootstrap-admin: login HTTP ${login.status}`); process.exit(1); }
          const { token } = await login.json();
          const change = await fetch(`${base}/api/me/password`, {
            method: 'POST',
            headers: { 'content-type': 'application/json', authorization: `Bearer ${token}` },
            body: JSON.stringify({ currentPassword: 'umami', newPassword: process.env.APP_BOOTSTRAP_ADMIN_PASSWORD }),
          });
          if (!change.ok) { console.error(`bootstrap-admin: password change HTTP ${change.status}`); process.exit(1); }
          console.log('bootstrap-admin: default password replaced');

  domains:
    primaryComponent: web
    publicUrlEnv: []
    onChange: restart
    needsHairpin: false

  smoke:
    - { name: heartbeat, http: { method: GET, path: /api/heartbeat }, expect: { status: [200] } }
    - {
        name: login-page,
        http: { method: GET, path: /login },
        expect: { status: [200], bodyNotContains: ['localhost:3000'] }
      }
    # The default credential must be refused once bootstrap-admin has run.
    # verified: smoke `http` takes a JSON body, POST only (schema.md §16, ≤ 16 KiB). `src/app/api/auth/login/route.ts`
    # L26 answers `unauthorized()` for a wrong credential, and `src/lib/response.ts` L20-L30 makes that 401.
    - {
        name: default-admin-refused,
        http: { method: POST, path: /api/auth/login, body: { username: admin, password: umami } },
        expect: { status: [401] }
      }

  # Only meaningful after switching to `strategy: dockerfile`: with `strategy: image` there is no Build to check.
  # verified from the upstream's own CI (`.github/workflows/ci.yml` at v3.4.0 — Node 22, pnpm 12.3.4,
  # `DATABASE_URL` = a dummy and `SKIP_DB_CHECK: 1`) and from `package.json` (`test` = `vitest run`, with a
  # `pretest` codegen step; `lint` = `biome lint .`; `engines.pnpm` = 12.3.4). The upstream Dockerfile builds with
  # a dummy `DATABASE_URL` (L40), so the dockerfile variant needs NO build service. Enable both when the strategy
  # changes:
  # - { name: test, command: 'pnpm install --frozen-lockfile && pnpm test', required: true, timeoutSeconds: 1800 }
  # - { name: lint, command: 'pnpm install --frozen-lockfile && pnpm lint', required: false, timeoutSeconds: 900 }
  checks: []

  agents:
    instructionFiles: []
    maxPullRequestChangedLines: 400

  # TODO(verify, APW-03): applying this Blueprint with `source.relation: link` makes rule R13
  # (`upstream_sync_requires_upstream`) an error and aborts apply, so apply must drop `upstreamSync` — and
  # `upstreamPullRequests.enabled` — for that relation. ACCEPTANCE.md E2E-03 links the long-lived Umami repository,
  # so that is the path the nightly lane takes; a fork keeps the weekly sync below.
  upstreamSync:
    schedule: '0 6 * * 2'
    mode: merge

  upstreamPullRequests:
    enabled: false
    requireApproval: true
