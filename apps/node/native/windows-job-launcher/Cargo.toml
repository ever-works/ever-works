[package]
name = "ever-works-windows-job-launcher"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
publish = false

[[bin]]
name = "ever-works-windows-job-launcher"
path = "src/main.rs"

[dependencies]
windows-sys = { version = "=0.61.2", features = [
	"Win32_Foundation",
	"Win32_Security",
	"Win32_Storage_FileSystem",
	"Win32_System_Console",
	"Win32_System_JobObjects",
	"Win32_System_Pipes",
	"Win32_System_Threading"
] }

[features]
default = []
test-fixtures = []

[profile.release]
codegen-units = 1
incremental = false
lto = "thin"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
